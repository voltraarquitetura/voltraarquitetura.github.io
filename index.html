    await estPosicionar(pid,{est:val('ep-est'),origem:val('ep-or')||'existente',ant:val('ep-ant'),adi:val('ep-adi'),resp,obs:val('ep-obs')});S.modal=null;S.openProj=pid;S.ui.estSel=S.ui.estSel||{};delete S.ui.estSel[pid];Object.keys(S.drafts).filter(x=>x.startsWith('ep-')).forEach(x=>delete S.drafts[x]);render();return;}
  if(k==='est-ret'){const pid=f.dataset.p,pr=S.projetos[pid],dest=val('er-dest'),mot=val('er-mot');if(mot.length<5){ferr(f,'Explique o motivo do retorno.');return;}

    await estDevolver(pid,dest,itens,mot,document.getElementById('er-pref')?val('er-pref'):false);S.modal=null;S.ui.estSel=S.ui.estSel||{};S.ui.estSel[pid]=dest;Object.keys(S.drafts).filter(x=>x.startsWith('er-')).forEach(x=>delete S.drafts[x]);render();return;}

    if(!disciplinas.length)data.avanco=rinfo?100:clamp(parseInt(val('pj-av'),10)||0,0,100);if(rinfo)data.retro=rinfo;
    const ok=await act(async()=>{const ref=id?D('projetos/'+id):Col('projetos').doc();if(id)await ref.update(data);else await ref.set({...data,criadoEm:Date.now(),criadoPor:myPid()||'admin'});

        const de=first(nomeDe(myPid()));for(const g of gestaoIds())await avisar(g,`${de} lançou o projeto “${nome}” como já concluído. Justificativa: ${rinfo.justificativa.length>70?rinfo.justificativa.slice(0,70)+'…':rinfo.justificativa}`,null,'retro');}

    case 'pessoa-edit':Object.keys(S.drafts).filter(x=>x.startsWith('pe-')).forEach(x=>delete S.drafts[x]);S.ui.rmArm=null;S.modal={type:'pessoa',id:b.dataset.p};if(S.cap.user&&pessoa(b.dataset.p)&&pessoa(b.dataset.p).conta)resolveProfiles([pessoa(b.dataset.p).conta]);render();break;
    case 'pessoa-nova':Object.keys(S.drafts).filter(x=>x.startsWith('pe-')).forEach(x=>delete S.drafts[x]);S.modal={type:'pessoa',id:''};render();break;
    case 'desvincular':await desvincular(b.dataset.p);break;
    case 'pessoa-rm':{const id=b.dataset.p;if(S.ui.rmArm!==id){S.ui.rmArm=id;render();break;}S.ui.rmArm=null;
      if(abertasDe(id).length||aguardandoDe(id).length){toast('Essa pessoa tem missões abertas ou entregas aguardando. Cancele ou conclua antes.');break;}
      const ok=await act(async()=>{await D('pessoas/'+id).delete();toast(SEATS[id]?'Baia liberada.':'Pessoa removida.');});if(ok){S.modal=null;if(S.sel===id)S.sel=null;render();}break;}
  }
});

/* ============ inicialização ============ */
function subscribe(){
  const db=S.cap.db,err=k=>e=>{console.warn(k,e);if(e&&e.code==='revoked'){S.readOnly=true;renderBanners();}S.loaded[k]=true;scheduleRender();};
  db.collection('pessoas').onSnapshot(s=>{S.pessoas=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loaded.pessoas=true;scheduleRender();},err('pessoas'));
  db.collection('missoes').where('status','in',['aberta','correcao','entregue']).onSnapshot(s=>{S.missoes=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loaded.missoes=true;scheduleRender();},err('missoes'));
  db.collection('entregas').orderBy('enviadoEm','desc').limit(400).onSnapshot(s=>{S.entregas=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loaded.entregas=true;scheduleRender();},err('entregas'));
  db.collection('projetos').onSnapshot(s=>{S.projetos=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loaded.projetos=true;scheduleRender();},err('projetos'));
  db.doc('config/geral').onSnapshot(s=>{S.config=s.exists?s.data():null;S.loaded.config=true;MAP.sig=null;scheduleRender();},err('config'));
  db.collection('atrasos').orderBy('em','desc').limit(800).onSnapshot(s=>{S.atrasos=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err('atrasos'));
  db.collection('conclusoes').orderBy('em','desc').limit(500).onSnapshot(s=>{S.conclusoes=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err('conclusoes'));
  db.collection('avisos').orderBy('em','desc').limit(250).onSnapshot(s=>{S.avisos=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err('avisos'));
  if(S.cap.fb&&S.owner){db.collection('acessos').onSnapshot(s=>{S.fbAcessos=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));scheduleRender();},e=>console.warn('acessos',e));
    db.collection('pedidos').onSnapshot(s=>{S.fbPedidos=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},e=>console.warn('pedidos',e));}
  if(S.uid)db.doc(`data/users/${S.uid}/estado`).onSnapshot(s=>{S.estado=s.exists?s.data():{lidosAte:0};scheduleRender();},()=>{});
}
async function limparAvisos(){if(!canAdmin()||!S.cap.db)return;try{const old=await Col('avisos').where('em','<',Date.now()-45*DAY).limit(80).get();for(const d of old.docs){await D('avisos/'+d.id).delete();}}catch(e){}}
async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){S.boot='semdb';render();return;}
  const use=n=>cl.use(n).catch(()=>null);
  const[db,user,assets,downloads]=await Promise.all([use('db'),use('user'),use('assets'),use('downloads')]);
  S.cap={db,user,assets,downloads,fb:cl.fb||null};
  if(!db){S.boot='semdb';render();return;}
  if(user){try{S.uid=await user.id();S.owner=await user.isOwner();S.canWrite=await user.can('data.write');}catch(e){}}
  if(S.canWrite===false)S.readOnly=true;
  if(!S.uid){try{S.estado={lidosAte:Number(localStorage.getItem('voltra-lidos'))||0};}catch(e){S.estado={lidosAte:0};}}
  S.boot='ok';subscribe();render();
  setTimeout(limparAvisos,15000);
}
setInterval(()=>{
  const now=Date.now();
  const tm=$('#timer');if(tm){const m=S.missoes[tm.dataset.m];if(m)tm.textContent=fmtDur(totalMs(m,now));}
  document.querySelectorAll('[data-live]').forEach(el=>{const m=S.missoes[el.dataset.live];if(m)el.textContent=fmtHM(totalMs(m,now));});
  const p=me();
  if(p&&p.pendente&&!S.swapping&&S.cap.db&&!S.readOnly){const f=focoDe(p.id);if(!f||!runningOf(f,now)){S.swapping=true;act(()=>trocarFoco(p.id)).finally(()=>{S.swapping=false;S.adiada[p.id]=false;});}}
},1000);
setInterval(()=>{if(S.view==='mesa'||S.view==='escritorio'||S.view==='missao')scheduleRender();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleRender();});
render();boot();
})();
</script>

<script type="module">
/* Ligação do sistema da Voltra com o Firebase (login e banco de dados).
   O resto do sistema é o mesmo usado dentro do Claude: aqui só trocamos o "motor" de dados. */
import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  createUserWithEmailAndPassword, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, memoryLocalCache, doc, collection,
  getDoc, getDocs, setDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit, runTransaction, writeBatch, Bytes } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const CFG = {
  apiKey: 'AIzaSyAlqBwWHXnhHbD_hcL2K9ihgqaOBBYbehI',
  authDomain: 'voltra-sistema.firebaseapp.com',
  projectId: 'voltra-sistema',
  storageBucket: 'voltra-sistema.firebasestorage.app',
  messagingSenderId: '914594175997',
  appId: '1:914594175997:web:a5046bc1c7f83bf2f6d794'
};

const app = initializeApp(CFG);
const auth = getAuth(app);
auth.languageCode = 'pt-BR';
let fs;
try { fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }), ignoreUndefinedProperties: true }); }
catch (e) { fs = initializeFirestore(app, { localCache: memoryLocalCache(), ignoreUndefinedProperties: true }); }

/* ---------- mensagens ---------- */
const MSG = {
  'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.',
  'auth/user-not-found': 'E-mail ou senha incorretos.', 'auth/invalid-email': 'Confira o e-mail.',
  'auth/missing-password': 'Digite a senha.', 'auth/too-many-requests': 'Muitas tentativas seguidas. Espere alguns minutos ou use “Esqueci minha senha”.',
  'auth/network-request-failed': 'Sem conexão com a internet. Confira e tente de novo.', 'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
  'auth/email-already-in-use': 'Esse e-mail já tem login.', 'auth/requires-recent-login': 'Por segurança, saia e entre de novo antes de trocar a senha.',
  'auth/operation-not-allowed': 'O login por e-mail e senha ainda não foi ativado no Firebase (Authentication › Método de login).',
  'auth/user-disabled': 'Esse login foi desativado.',
  'permission-denied': 'Sem permissão. Confira se as regras do banco foram publicadas no Firebase.',
  'unavailable': 'Sem conexão com o banco de dados. Confira a internet e tente de novo.',
  'failed-precondition': 'O banco de dados ainda não foi criado no Firebase (Firestore Database).',
  'not-found': 'O banco de dados ainda não foi criado no Firebase (Firestore Database).'
};
const msg = e => (e && e.amigavel && e.message) || (e && (MSG[e.code] || (e.code && String(e.code).startsWith('auth/') ? 'Não foi possível entrar agora. Tente de novo.' : null))) || (e && e.message) || 'Algo deu errado. Tente de novo.';

/* ---------- dados: mesmo formato do banco do Claude ---------- */
const clean = d => JSON.parse(JSON.stringify(d === undefined ? null : d));
// o Firestore não guarda lista dentro de lista: embrulhamos e desembrulhamos sem o sistema perceber
const enc = v => Array.isArray(v) ? v.map(x => Array.isArray(x) ? { _arr_: enc(x) } : enc(x))
  : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, enc(x)])) : v;
const dec = v => Array.isArray(v) ? v.map(dec)
  : (v && typeof v === 'object') ? (Object.keys(v).length === 1 && Array.isArray(v._arr_) ? dec(v._arr_) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, dec(x)]))) : v;
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
function merge(a, b) { const o = { ...a }; for (const k in b) { if (isObj(b[k]) && isObj(o[k])) o[k] = merge(o[k], b[k]); else o[k] = b[k]; } return o; }
const erro = e => { const x = new Error(msg(e)); x.code = e && e.code; x.cause = e; return x; };
const seg = p => String(p).split('/').filter(Boolean);

const wrapDoc = s => { const ex = s.exists(); const d = ex ? dec(s.data()) : undefined; return { id: s.id, exists: ex, data: () => (d === undefined ? undefined : JSON.parse(JSON.stringify(d))), metadata: s.metadata }; };
const wrapQ = (docs, meta) => ({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta });

function docRef(path) {
  if (seg(path).length % 2) throw new TypeError('Caminho de documento inválido: ' + path);
  const ref = doc(fs, path);
  return {
    id: ref.id, path,
    async get() { try { return wrapDoc(await getDoc(ref)); } catch (e) { throw erro(e); } },
    async set(d) { try { await setDoc(ref, enc(clean(d))); } catch (e) { throw erro(e); } },
    async update(d) {
      const novo = clean(d);
      try {
        await runTransaction(fs, async tx => {
          const s = await tx.get(ref);
          if (!s.exists()) { const x = new Error('Documento não encontrado: ' + path); x.code = 'invalid_argument'; throw x; }
          tx.set(ref, enc(merge(dec(s.data()), novo)));
        });
      } catch (e) { if (e && e.code === 'invalid_argument') throw e; throw erro(e); }
    },
    async delete() { try { await deleteDoc(ref); } catch (e) { throw erro(e); } },
    async acquire(o) {
      const holder = (o && o.holder) || 'x', ttl = (o && o.ttlMs) || 7000;
      try {
        return await runTransaction(fs, async tx => {
          const s = await tx.get(ref), now = Date.now(), d = s.exists() ? s.data() : null;
          if (!d || !d.ate || d.ate < now || d.holder === holder) { tx.set(ref, { holder, ate: now + ttl }); return { acquired: true }; }
          return { acquired: false, holder: d.holder };
        });
      } catch (e) { return { acquired: true }; }
    },
    onSnapshot(next, err) { return onSnapshot(ref, s => next(wrapDoc(s)), e => { console.warn(path, e); if (err) err(erro(e)); }); },
    collection(p) { return colRef(path + '/' + p); }
  };
}

function colRef(path, filtros = [], ord = null, lim = null) {
  if (seg(path).length % 2 === 0) throw new TypeError('Caminho de coleção inválido: ' + path);
  const col = collection(fs, path);
  // filtro + ordem em outro campo pediria índice composto no Firebase: nesses casos ordenamos aqui mesmo
  const local = !!(ord && filtros.length && filtros.some(f => f[0] !== ord[0]));
  const montar = () => {
    const c = filtros.map(([f, op, v]) => where(f, op, v));
    if (ord && !local) c.push(orderBy(ord[0], ord[1] || 'asc'));
    if (lim && !local) c.push(limit(lim));
    return c.length ? query(col, ...c) : col;
  };
  const pos = docs => {
    if (!local) return docs;
    const [f, dir] = ord;
    docs = docs.slice().sort((a, b) => { const x = a.data()[f], y = b.data()[f]; if (x === y) return 0; if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : 1) * (dir === 'desc' ? -1 : 1); });
    return lim ? docs.slice(0, lim) : docs;
  };
  return {
    path,
    where: (f, op, v) => colRef(path, [...filtros, [f, op, v]], ord, lim),
    orderBy: (f, d) => colRef(path, filtros, [f, d || 'asc'], lim),
    limit: n => colRef(path, filtros, ord, n),
    async get() { try { const qs = await getDocs(montar()); return wrapQ(pos(qs.docs.map(wrapDoc)), qs.metadata); } catch (e) { throw erro(e); } },
    onSnapshot(next, err) { return onSnapshot(montar(), qs => next(wrapQ(pos(qs.docs.map(wrapDoc)), qs.metadata)), e => { console.warn(path, e); if (err) err(erro(e)); }); },
    doc(id) { return docRef(path + '/' + (id || doc(col).id)); },
    async add(d) { try { const r = await addDoc(col, enc(clean(d))); return docRef(path + '/' + r.id); } catch (e) { throw erro(e); } }
  };
}
const db = { doc: docRef, collection: p => colRef(p) };

/* ---------- arquivos: guardados no próprio banco, em pedaços (o plano gratuito não tem Storage) ---------- */
const PARTE = 700 * 1024;
let quem = null;
const assets = {
  async upload(blob, o) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const id = doc(collection(fs, 'arquivos')).id, n = Math.max(1, Math.ceil(buf.length / PARTE));
    try {
      for (let i = 0; i < n; i += 8) {
        const b = writeBatch(fs);
        for (let j = i; j < Math.min(n, i + 8); j++) b.set(doc(fs, 'partes', id + '-' + j), { arq: id, i: j, d: Bytes.fromUint8Array(buf.subarray(j * PARTE, (j + 1) * PARTE)) });
        await b.commit();
      }
      const tipo = (o && o.type) || blob.type || 'application/octet-stream';
      await setDoc(doc(fs, 'arquivos', id), { tipo, tam: buf.length, partes: n, em: Date.now(), por: quem });
      return { id, url: '/_blob/' + id, sizeBytes: buf.length, contentType: tipo };
    } catch (e) { throw erro(e); }
  },
  async delete(id) {
    try {
      const m = await getDoc(doc(fs, 'arquivos', id)); const n = m.exists() ? m.data().partes || 0 : 0;
      for (let i = 0; i < n; i += 400) { const b = writeBatch(fs); for (let j = i; j < Math.min(n, i + 400); j++) b.delete(doc(fs, 'partes', id + '-' + j)); await b.commit(); }
      await deleteDoc(doc(fs, 'arquivos', id)); return { deleted: true };
    } catch (e) { return { deleted: false }; }
  },
  async list() { return { assets: [], usage: {} }; }
};
async function lerArquivo(id) {
  const m = await getDoc(doc(fs, 'arquivos', id)); if (!m.exists()) return null;
  const { partes, tipo } = m.data();
  const ps = await Promise.all(Array.from({ length: partes }, (_, i) => getDoc(doc(fs, 'partes', id + '-' + i))));
  return new Blob(ps.map(p => p.data().d.toUint8Array()), { type: tipo || 'application/octet-stream' });
}
// o sistema baixa os anexos por "/_blob/<id>": aqui esse endereço é montado a partir do banco
const fetchOriginal = window.fetch.bind(window);
window.fetch = async (u, o) => {
  const m = String((u && u.url) || u).match(/\/_blob\/([A-Za-z0-9_-]+)$/);
  if (!m) return fetchOriginal(u, o);
  try { const b = await lerArquivo(m[1]); return b ? new Response(b) : new Response('', { status: 404 }); }
  catch (e) { console.warn('arquivo', e); return new Response('', { status: 500 }); }
};
const downloads = {
  async save({ filename, data }) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename || 'arquivo';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return { status: 'saved' };
  }
};

/* ---------- tela de entrada ---------- */
const gate = document.getElementById('fbgate'), corpo = document.getElementById('fbg-body');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mostrar = html => { gate.hidden = false; corpo.innerHTML = html; const f = corpo.querySelector('input'); if (f) f.focus(); };
const carregando = t => mostrar(`<p class="fbg-load"><span class="spin"></span>${esc(t || 'Carregando…')}</p>`);
const avisoErr = (t) => { let el = corpo.querySelector('.ferr'); if (!el) { el = document.createElement('p'); el.className = 'ferr'; el.setAttribute('role', 'alert'); corpo.appendChild(el); } el.textContent = t; };
const avisoOk = (t) => { let el = corpo.querySelector('.msg.ok'); if (!el) { el = document.createElement('p'); el.className = 'msg ok'; corpo.appendChild(el); } el.textContent = t; };
const ocupado = (b, t) => { const bt = corpo.querySelector('button[type=submit]'); if (bt) { bt.disabled = b; if (t) bt.textContent = t; } };

let setupFeito = null;
async function checarSetup() {
  try { const s = await getDoc(doc(fs, 'config', 'setup')); setupFeito = s.exists(); } catch (e) { console.warn('setup', e); setupFeito = null; }
  return setupFeito;
}

function telaLogin(email) {
  mostrar(`<h1>Entrar</h1><p class="fbg-muted">Sistema da Voltra Arquitetura & Engenharia.</p>
  <form id="fbg-login" class="form" novalidate>
    <label for="fbg-email">E-mail<input id="fbg-email" type="email" autocomplete="username" inputmode="email" value="${esc(email || '')}"></label>
    <label for="fbg-senha">Senha<input id="fbg-senha" type="password" autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
  <div class="fbg-links"><button class="fbg-link" type="button" id="fbg-esqueci">Esqueci minha senha</button>
  ${setupFeito !== true ? '<button class="fbg-link" type="button" id="fbg-ir-setup">Configuração inicial do sistema</button>' : ''}</div>
  ${setupFeito === null ? '<p class="msg err">Não consegui consultar o banco de dados. Se o sistema é novo, confira no Firebase se o Firestore foi criado e se as regras foram publicadas.</p>' : ''}
  <p class="fbg-muted">Ainda não tem login? Peça para a gestão criar o seu.</p>`);
  corpo.querySelector('#fbg-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const em = corpo.querySelector('#fbg-email').value.trim(), sn = corpo.querySelector('#fbg-senha').value;
    if (!em || !sn) { avisoErr('Digite o e-mail e a senha.'); return; }
    ocupado(true, 'Entrando…');
    try { await signInWithEmailAndPassword(auth, em, sn); } catch (e) { ocupado(false, 'Entrar'); avisoErr(msg(e)); }
  });
  corpo.querySelector('#fbg-esqueci').addEventListener('click', async () => {
    const em = corpo.querySelector('#fbg-email').value.trim();
    if (!em) { avisoErr('Digite o seu e-mail no campo acima e clique de novo em “Esqueci minha senha”.'); return; }
    try { await sendPasswordResetEmail(auth, em); avisoOk('Se esse e-mail tiver login, chega uma mensagem para criar uma nova senha. Confira também o spam.'); }
    catch (e) { avisoErr(msg(e)); }
  });
  const ir = corpo.querySelector('#fbg-ir-setup'); if (ir) ir.addEventListener('click', () => telaSetup());
}

function telaSetup() {
  mostrar(`<h1>Configuração inicial</h1><p class="fbg-muted">Crie o login do administrador do sistema. Esta tela só funciona uma vez: depois, os logins são criados pela gestão em Ajustes.</p>
  <form id="fbg-setup" class="form" novalidate>
    <label for="fbg-semail">E-mail do administrador<input id="fbg-semail" type="email" autocomplete="username" inputmode="email"></label>
    <label for="fbg-ssenha">Senha (mínimo 6 caracteres)<input id="fbg-ssenha" type="password" autocomplete="new-password"></label>
    <label for="fbg-ssenha2">Repita a senha<input id="fbg-ssenha2" type="password" autocomplete="new-password"></label>
    <button class="btn primary" type="submit">Criar administrador</button>
  </form>
  <div class="fbg-links"><button class="fbg-link" type="button" id="fbg-ir-login">Já tenho login: entrar</button></div>`);
  corpo.querySelector('#fbg-ir-login').addEventListener('click', () => telaLogin());
  corpo.querySelector('#fbg-setup').addEventListener('submit', async ev => {
    ev.preventDefault();
    const em = corpo.querySelector('#fbg-semail').value.trim(), s1 = corpo.querySelector('#fbg-ssenha').value, s2 = corpo.querySelector('#fbg-ssenha2').value;
    if (!em) { avisoErr('Digite o e-mail.'); return; }
    if (s1.length < 6) { avisoErr('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if (s1 !== s2) { avisoErr('As duas senhas estão diferentes.'); return; }
    ocupado(true, 'Criando…');
    try { querSetup = true; await createUserWithEmailAndPassword(auth, em, s1); }
    catch (e) { querSetup = false; ocupado(false, 'Criar administrador'); avisoErr(e.code === 'auth/email-already-in-use' ? 'Esse e-mail já tem login. Use “Já tenho login: entrar” e a configuração termina depois de entrar.' : msg(e)); }
  });
}

async function concluirSetup(u) {
  const b = writeBatch(fs);
  b.set(doc(fs, 'acessos', u.uid), { email: (u.email || '').toLowerCase(), pessoa: null, gestao: true, ativo: true, criadoEm: Date.now(), por: u.uid, setup: true });
  b.set(doc(fs, 'config', 'setup'), { por: u.uid, email: (u.email || '').toLowerCase(), em: Date.now() });
  await b.commit();
  setupFeito = true;
}

function telaConcluirSetup(u) {
  mostrar(`<h1>Configuração inicial</h1><p class="fbg-muted">Você entrou como <strong>${esc(u.email)}</strong>. Clique abaixo para tornar este login o administrador do sistema.</p>
  <form id="fbg-conc" class="form" novalidate><button class="btn primary" type="submit">Concluir configuração</button></form>
  <div class="fbg-links"><button class="fbg-link" type="button" id="fbg-sair">Sair</button></div>`);
  corpo.querySelector('#fbg-sair').addEventListener('click', () => signOut(auth));
  corpo.querySelector('#fbg-conc').addEventListener('submit', async ev => {
    ev.preventDefault(); ocupado(true, 'Configurando…');
    try { await concluirSetup(u); } catch (e) { ocupado(false, 'Concluir configuração'); avisoErr(msg(e)); }
  });
}

function telaEspera(u) {
  mostrar(`<h1>Aguardando liberação</h1><p class="fbg-muted">Você entrou como <strong>${esc(u.email)}</strong>, mas esse login ainda não foi liberado para o sistema.</p>
  <p class="fbg-muted">A gestão libera em Ajustes › Acessos ao site. Esta tela abre o sistema sozinha assim que for liberado.</p>
  <div class="fbg-links"><button class="fbg-link" type="button" id="fbg-sair">Sair e entrar com outro e-mail</button></div>`);
  corpo.querySelector('#fbg-sair').addEventListener('click', () => signOut(auth));
}

function telaErro(t, u) {
  mostrar(`<h1>Não foi possível abrir</h1><p class="fbg-muted">${esc(t)}</p>
  <form id="fbg-de-novo" class="form" novalidate><button class="btn primary" type="submit">Tentar de novo</button></form>
  ${u ? '<div class="fbg-links"><button class="fbg-link" type="button" id="fbg-sair">Sair</button></div>' : ''}`);
  corpo.querySelector('#fbg-de-novo').addEventListener('submit', ev => { ev.preventDefault(); location.reload(); });
  const sa = corpo.querySelector('#fbg-sair'); if (sa) sa.addEventListener('click', () => signOut(auth));
}

/* ---------- funções extras usadas pelas telas de Ajustes e Sua conta ---------- */
function apiPara(u, gestao) {
  return {
    email: u.email, uid: u.uid, gestao, msg,
    async sair() { await signOut(auth); location.reload(); },
    async trocarSenha(atual, nova) {
      try { await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, atual)); await updatePassword(u, nova); }
      catch (e) { if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password') { const x = new Error('A senha atual não confere.'); x.code = e.code; x.amigavel = true; throw x; } throw erro(e); }
    },
    async criarAcesso({ pid, email, senha, gestao: g }) {
      // um "app" separado cria o login sem desconectar quem está cadastrando
      const sec = initializeApp(CFG, 'cadastro-' + Date.now());
      let nuid;
      try { const c = await createUserWithEmailAndPassword(getAuth(sec), email, senha); nuid = c.user.uid; }
      catch (e) {
        if (e.code === 'auth/email-already-in-use') { const x = new Error('Esse e-mail já tem login. Peça para a pessoa entrar no site uma vez: o pedido aparece aqui em “Pedidos de acesso” para você liberar.'); x.code = e.code; x.amigavel = true; throw x; }
        throw erro(e);
      } finally { try { await signOut(getAuth(sec)); } catch (e) {} try { await deleteApp(sec); } catch (e) {} }
      const b = writeBatch(fs);
      b.set(doc(fs, 'acessos', nuid), { email, pessoa: pid, gestao: !!g, ativo: true, criadoEm: Date.now(), por: u.uid });
      b.set(doc(fs, 'pessoas', pid), { conta: nuid }, { merge: true });
      try { await b.commit(); } catch (e) { throw erro(e); }
      return nuid;
    },
    async liberar({ uid, pid, email, gestao: g }) {
      const b = writeBatch(fs);
      b.set(doc(fs, 'acessos', uid), { email: email || '', pessoa: pid, gestao: !!g, ativo: true, criadoEm: Date.now(), por: u.uid });
      b.set(doc(fs, 'pessoas', pid), { conta: uid }, { merge: true });
      b.delete(doc(fs, 'pedidos', uid));
      try { await b.commit(); } catch (e) { throw erro(e); }
    },
    async recusar(uid) { try { await deleteDoc(doc(fs, 'pedidos', uid)); } catch (e) { throw erro(e); } },
    async bloquear(uid, bloq) { try { await setDoc(doc(fs, 'acessos', uid), { ativo: !bloq, alteradoEm: Date.now(), alteradoPor: u.uid }, { merge: true }); } catch (e) { throw erro(e); } },
    async importar(colecoes, prog) {
      const atuais = {};
      try { const s = await getDocs(collection(fs, 'pessoas')); s.docs.forEach(d => { atuais[d.id] = d.data(); }); } catch (e) {}
      const ops = [];
      for (const [c, docs] of Object.entries(colecoes || {})) {
        if (!['pessoas', 'projetos', 'missoes', 'entregas', 'conclusoes', 'avisos', 'comentarios', 'atrasos', 'config'].includes(c)) continue;
        for (const [id, d] of Object.entries(docs || {})) {
          if (c === 'config' && id === 'setup') continue;
          let dd = clean(d);
          if (c === 'pessoas') { dd = { ...dd, conta: (atuais[id] && atuais[id].conta) || null }; }
          ops.push([c, id, dd]);
        }
      }
      let n = 0;
      for (let i = 0; i < ops.length; i += 400) {
        const b = writeBatch(fs);
        for (const [c, id, d] of ops.slice(i, i + 400)) b.set(doc(fs, c, id), enc(d));
        try { await b.commit(); } catch (e) { throw erro(e); }
        n += Math.min(400, ops.length - i); if (prog) prog(n);
      }
      return n;
    }
  };
}

/* ---------- início ---------- */
let iniciado = false, querSetup = false, pedido = false, unAcesso = null;
async function iniciar(u, acesso) {
  let gestao = acesso.gestao === true;
  if (!gestao) {
    try { const s = await getDocs(query(collection(fs, 'pessoas'), where('conta', '==', u.uid))); gestao = s.docs.some(d => ['dono', 'gestora'].includes(d.data().papel)); } catch (e) {}
  }
  const user = {
    id: async () => u.uid, isOwner: async () => gestao, canEdit: async () => gestao, can: async () => true,
    me: async () => ({ id: u.uid, name: u.email || '' }),
    profiles: async ids => {
      const out = {};
      for (const id of [].concat(ids)) {
        let name = '';
        try { const s = await getDoc(doc(fs, 'acessos', id)); if (s.exists()) name = s.data().email || ''; } catch (e) {}
        out[id] = { id, name, avatarUrl: '', color: '#888', email: name || null, isMe: id === u.uid, guest: false };
      }
      return out;
    },
    search: async () => []
  };
  window.claude.fb = apiPara(u, gestao);
  iniciado = true;
  gate.hidden = true; corpo.innerHTML = '';
  quem = u.uid;
  window.__fbPronto({ db, user, assets, downloads });
}

onAuthStateChanged(auth, async u => {
  if (unAcesso) { unAcesso(); unAcesso = null; }
  if (iniciado) { location.reload(); return; }
  if (!u) { carregando(); await checarSetup(); if (setupFeito === false) telaSetup(); else telaLogin(); return; }
  carregando('Abrindo o sistema…');
  unAcesso = onSnapshot(doc(fs, 'acessos', u.uid), async s => {
    const a = s.exists() ? s.data() : null;
    if (iniciado) { if (!a || a.ativo === false) location.reload(); return; }
    if (a && a.ativo !== false) { iniciar(u, a); return; }
    if (setupFeito === null) await checarSetup();
    if (setupFeito === false) {
      if (querSetup) { try { await concluirSetup(u); } catch (e) { telaConcluirSetup(u); avisoErr(msg(e)); } return; }
      telaConcluirSetup(u); return;
    }
    if (a && a.ativo === false) { mostrar(`<h1>Acesso bloqueado</h1><p class="fbg-muted">O login <strong>${esc(u.email)}</strong> foi bloqueado pela gestão.</p><div class="fbg-links"><button class="fbg-link" type="button" id="fbg-sair">Sair</button></div>`); corpo.querySelector('#fbg-sair').addEventListener('click', () => signOut(auth)); return; }
    if (!pedido) { pedido = true; try { await setDoc(doc(fs, 'pedidos', u.uid), { email: (u.email || '').toLowerCase(), em: Date.now() }, { merge: true }); } catch (e) { console.warn('pedido', e); } }
    telaEspera(u);
  }, e => { console.warn('acesso', e); telaErro(msg(e), u); });
});
