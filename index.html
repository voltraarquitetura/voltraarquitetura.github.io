<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C3A5F">
<style>body{margin:0}[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
<style>
#fbgate{position:fixed;inset:0;z-index:100;background:var(--floor,#ECEFEA);color:var(--ink,#16201B);display:grid;place-items:center;padding:16px;overflow:auto;font-family:var(--font-ui,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif)}
.fbg-card{width:100%;max-width:400px;background:var(--surface,#F7F9F6);border:1px solid var(--line,#C9D2CC);border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgb(0 0 0 / .06)}
.fbg-mark{font-weight:800;letter-spacing:.18em;font-size:20px;color:var(--navy,#1C3A5F)}
.fbg-card h1{font-size:22px;margin:0}
.fbg-card p{margin:0}
.fbg-muted{color:var(--muted,#56645D);font-size:14px;line-height:1.45}
.fbg-links{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fbg-link{background:none;border:0;padding:0;color:var(--navy,#1C3A5F);font:inherit;font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer}
.fbg-load{display:flex;gap:10px;align-items:center;color:var(--muted,#56645D)}
</style>
<script>
/* Site da Voltra: o sistema conversa com o Firebase pela mesma interface que usa dentro do Claude. */
(function(){var ok;var pronto=new Promise(function(r){ok=r;});window.__fbPronto=ok;
  window.claude={use:function(n){return pronto.then(function(c){return c[n]||null;});}};})();
</script>
</head>
<body>
<div id="fbgate" role="dialog" aria-modal="true" aria-label="Entrar no sistema da Voltra"><div class="fbg-card"><div class="fbg-mark">VOLTRA</div><div id="fbg-body" class="form"><p class="fbg-load"><span class="spin"></span>Carregando…</p></div></div></div>
<title>Voltra Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo; abas no topo (desktop) ou barra inferior (celular). Escritório isométrico com painel lateral,
   que no celular vira folha inferior. Paleta do barracão: concreto sálvia, azul-marinho do teto, madeira do brise. */
:root{
  --floor:#ECEFEA; --surface:#F7F9F6; --raise:#FFFFFF; --ink:#16201B; --muted:#56645D; --line:#C9D2CC; --wall:#8A9790;
  --navy:#1C3A5F; --navy-ink:#FFFFFF; --navy-soft:#DFE8F2;
  --wood:#93633D; --wood-soft:#EBDDCB; --wood-ink:#4F3420; --leaf:#5F7F55;
  --ok:#2D8652; --warn:#D06C0E; --crit:#C8392E; --pink:#C2448A; --vago:#9AA59F; --run:#2F80ED;
  --font-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hh:58px; --navh:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --floor:#0F1412; --surface:#171E1B; --raise:#1E2723; --ink:#E3EAE5; --muted:#A3B1AA; --line:#2E3934; --wall:#5D6A63;
  --navy:#93B5DE; --navy-ink:#0E1928; --navy-soft:#1C2A3A;
  --wood:#C3915F; --wood-soft:#3A2C1F; --wood-ink:#EDD2B0; --leaf:#8DB07F;
  --ok:#4FBE83; --warn:#F09444; --crit:#EF675C; --pink:#EA7EB8; --vago:#5B6862; --run:#6AA8FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --floor:#0F1412; --surface:#171E1B; --raise:#1E2723; --ink:#E3EAE5; --muted:#A3B1AA; --line:#2E3934; --wall:#5D6A63;
  --navy:#93B5DE; --navy-ink:#0E1928; --navy-soft:#1C2A3A;
  --wood:#C3915F; --wood-soft:#3A2C1F; --wood-ink:#EDD2B0; --leaf:#8DB07F;
  --ok:#4FBE83; --warn:#F09444; --crit:#EF675C; --pink:#EA7EB8; --vago:#5B6862; --run:#6AA8FF; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--floor);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(21px,3vw,27px);font-weight:750;font-stretch:115%;letter-spacing:-.01em;line-height:1.15}
h2{font-size:18px;font-weight:700;font-stretch:106%;line-height:1.25}
h3{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .hint{color:var(--muted);font-size:13px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;min-height:var(--hh);padding-block:6px}
.mark{font-weight:800;font-stretch:125%;letter-spacing:.16em;font-size:16px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:12px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink);background:var(--floor)}
.tabs button[aria-current="page"]{color:var(--navy);background:var(--navy-soft)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.cnt{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font:700 11px/19px var(--font-ui);text-align:center;display:inline-block}
.mebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;max-width:220px}
.mebtn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:12px;background:var(--navy-soft);color:var(--navy)}
.av.lg{width:46px;height:46px;font-size:15px;border:3px solid var(--c,var(--line));background:var(--raise);color:var(--ink)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn .cnt{position:absolute;top:-6px;right:-6px}
.nav{display:none}
.banner{font-size:13.5px;padding-block:9px;border-bottom:1px solid var(--line);background:var(--navy-soft)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.banner .btn{margin-left:8px}
.main{padding-block:16px 48px}

/* botões, chips, formulários */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;line-height:1.1;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover:not(:disabled){border-color:var(--wall)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 10px;font-size:13px;min-height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.xbtn{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none}
.xbtn:hover{background:var(--floor);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.noi::before{display:none}
.chip svg{width:13px;height:13px}
.s-verde{--c:var(--ok)} .s-laranja{--c:var(--warn)} .s-vermelho{--c:var(--crit)} .s-sem{--c:var(--pink)} .s-vaga{--c:var(--vago)} .s-run{--c:var(--run)} .s-amp,.s-navy{--c:var(--navy)} .s-wood{--c:var(--wood)}
.form{display:flex;flex-direction:column;gap:12px}
.form label,.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form input:not([type=checkbox]),.form select,.form textarea,.inp{font-size:16px;font-weight:400;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.form textarea{resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;flex-direction:row!important}
.check input{width:20px;height:20px;accent-color:var(--navy);flex:none}
.ferr{color:var(--crit);font-size:13px;font-weight:600}
.msg{font-size:14px;padding:10px 12px;border-radius:10px}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:color-mix(in srgb,var(--ok) 70%,var(--ink))}
.msg.err{background:color-mix(in srgb,var(--crit) 12%,var(--surface));color:color-mix(in srgb,var(--crit) 75%,var(--ink))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
details.fold{border:1px solid var(--line);border-radius:12px;background:var(--raise)}
details.fold>summary{cursor:pointer;padding:12px 14px;font-weight:650;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-weight:500;font-size:18px;color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold>.in{padding:0 14px 14px}

/* escritório */
.office{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:16px;align-items:start}
.mapcol{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.maphead{display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.secs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.secs button{flex:none;font-weight:600;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--raise);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.secs button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.map{position:relative;height:clamp(380px,calc(100dvh - 290px),1100px);background:#E9EAE6;border-block:1px solid var(--line);touch-action:none;overflow:hidden}
:root[data-theme="dark"] .map{background:#1A201D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map{background:#1A201D}}
.map svg{display:block;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none;font-family:var(--font-ui)}
.map.dragging svg{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgb(0 0 0 / .08)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:10px 16px 14px}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:12px;border-radius:3px;background:var(--c)}
.sw.s-vaga{background:#3A3C41}
.lg-amp{width:16px;height:16px;border-radius:50%;background:#1C3A5F;display:grid;place-items:center;color:#fff}
.lg-run{width:10px;height:10px;border-radius:50%;background:#2F80ED}
#iso .hit{fill:transparent;cursor:pointer;outline:none}
#iso .hit:focus-visible{fill:rgb(28 58 95 / .18);stroke:#1C3A5F;stroke-width:1}
#iso .stag{cursor:zoom-in}
#iso .nm{font-size:calc(13px * var(--k,.5));font-weight:700;fill:#13202D;stroke:#FFFFFF;stroke-width:calc(3.2px * var(--k,.5));paint-order:stroke;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
#iso .stag,#iso .atag{transform-box:fill-box;transform-origin:center;transform:scale(var(--ts,1))}
#iso .bdg{transform-box:fill-box;transform-origin:center;transform:scale(var(--bs,1))}
#iso.far .nm{display:none}
#iso .ovl{pointer-events:none}
@media (prefers-reduced-motion:no-preference){#iso .rundot{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}

/* painel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh) + 14px);max-height:calc(100dvh - var(--hh) - 30px);overflow:auto;min-width:0}
.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-family:var(--font-mono);font-size:12px;font-weight:600;background:var(--navy-soft);color:var(--navy);padding:3px 9px;border-radius:999px}
.pp-head{display:flex;align-items:center;gap:12px}
.pp-id{flex:1;min-width:0}
.pp-id p{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.medal-s{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;color:var(--wood-ink)}
.medal-s svg{color:var(--wood)}
.kv{margin:0;display:flex;flex-direction:column;gap:9px}
.kv div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{margin:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv dd span{font-size:12.5px;color:var(--muted)}
.mbox{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--raise);display:flex;flex-direction:column;gap:12px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;background:var(--navy-soft);padding:10px 12px;border-radius:10px}
.note svg{flex:none;color:var(--navy);margin-top:1px}
.note.wood{background:var(--wood-soft);color:var(--wood-ink)}
.note.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface))}
.note.crit{background:color-mix(in srgb,var(--crit) 13%,var(--surface))}.note.crit svg{color:var(--crit)}
.lg-sp{width:10px;height:10px;border-radius:50%;background:#C8392E}
.linkbtn{background:none;border:0;padding:0;color:var(--navy);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.srow:hover{border-color:var(--wall)}
.srow-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.srow-h span{color:var(--muted);font-size:12.5px}
.sbar{display:flex;gap:2px;height:9px;border-radius:999px;overflow:hidden;background:var(--floor)}
.sbar i{background:var(--c);display:block}
.scount{font-size:12.5px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.plist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 8px;border-radius:9px;cursor:pointer}
.plist button:hover{background:var(--floor)}
.plist small{display:block;color:var(--muted);font-size:12.5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.fila{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fila li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--raise);font-size:13.5px}
.fila li>span:not(.dot){flex:1;min-width:0}
.fila li>svg{flex:none;color:var(--navy)}
.fila small{display:block;color:var(--muted);font-size:12px}

/* conversa */
.thread{display:flex;flex-direction:column;gap:10px}
.msgs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.msgs li{background:var(--raise);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:9px 11px;max-width:92%;align-self:flex-start}
.msgs li.mine{align-self:flex-end;background:var(--navy-soft);border-color:transparent;border-radius:12px 12px 4px 12px}
.msgs li.sys{align-self:stretch;max-width:none;background:color-mix(in srgb,var(--warn) 11%,var(--surface));border-radius:10px}
.who{display:flex;gap:8px;align-items:baseline;font-size:12.5px;font-weight:700}
.who time{font-weight:400;color:var(--muted);font-family:var(--font-mono);font-size:11.5px}
.msgs p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:2px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--raise);resize:none;min-height:44px;max-height:160px}

/* arquivos */
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 10px;background:var(--raise)}
.fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ext{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--wood-soft);color:var(--wood-ink);flex:none;text-transform:uppercase}
.files small{color:var(--muted);font-size:12px;flex:none}
.drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--wall);border-radius:12px;padding:14px;cursor:pointer;background:var(--raise)}
.drop span{display:flex;flex-direction:column;gap:2px}
.drop small{color:var(--muted);font-size:12.5px}
.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.vh:focus-visible + .drop{outline:2px solid var(--navy);outline-offset:2px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--navy);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* colaborador */
.col{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.medal{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--wood-soft);color:var(--wood-ink);font-size:13px}
.medal svg{color:var(--wood)}
.medal strong{font-size:16px}
.mission{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.mission.st-vermelho{border-color:color-mix(in srgb,var(--crit) 55%,var(--line));box-shadow:inset 0 4px 0 var(--crit)}
.mission.st-laranja{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));box-shadow:inset 0 4px 0 var(--warn)}
.mission.st-verde{box-shadow:inset 0 4px 0 var(--ok)}

/* projetos */
.phd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;display:flex;flex-direction:column}
.pcard.open{grid-column:1/-1;border-color:var(--wall)}
.pcard{position:relative}
.pcard.has-menu .ptop{padding-right:38px}
.pmenu-b{all:unset;box-sizing:border-box;position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;font-weight:800;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;z-index:3}
.pmenu-b:hover,.pmenu-b[aria-expanded="true"]{color:var(--navy);border-color:var(--navy)}
.pmenu-b:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.pmenu{position:absolute;top:52px;right:12px;z-index:20;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.18);padding:6px;min-width:250px;max-width:calc(100% - 24px);display:flex;flex-direction:column}
.pmenu button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.pmenu button:hover,.pmenu button:focus-visible{background:var(--navy-soft);color:var(--navy)}
.pmenu i{font-style:normal;width:18px;text-align:center;flex:none}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 0 14px}
.pcrumb span{color:var(--muted);font-size:14px}.pcrumb strong{font-size:14px}
.pcard.drag-ph{opacity:.35;outline:2px dashed var(--wall);outline-offset:-2px}
.pghost{position:fixed;z-index:80;pointer-events:none;width:300px;transform:rotate(-3deg);box-shadow:0 22px 40px rgba(0,0,0,.25);background:var(--surface);border:2px solid var(--navy);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
body.pdrag{user-select:none;-webkit-user-select:none}
body.pdrag,body.pdrag *{cursor:grabbing!important}
body.pdrag .ptabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh) + 4px);z-index:25;background:var(--floor);padding:8px 0;box-shadow:0 10px 14px -12px rgba(0,0,0,.25)}
body.pdrag .ptabs .seg button.drop-ok{outline:2px dashed var(--navy);outline-offset:3px}
body.pdrag .ptabs .seg button.drop-on{outline:3px dashed var(--wood);outline-offset:3px;background:var(--wood-soft);color:var(--wood-ink)}
.pdrag-tip{position:fixed;z-index:82;background:var(--wood);color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;box-shadow:0 6px 16px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
.pdrag-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:81;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:0 10px 26px rgba(0,0,0,.22);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.ptog{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:16px;cursor:pointer;border-radius:16px}
.ptog:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ptop{display:flex;gap:12px;align-items:center}
.pico{flex:none;width:60px;height:52px;display:block}
.pname{font-size:17px;font-weight:700;font-stretch:105%;line-height:1.2;display:block}
.pcity{font-size:13px;color:var(--muted);display:block}
.prog{display:block;height:8px;border-radius:999px;background:var(--floor);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--navy);border-radius:999px}
.pnums{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pnums .mono{color:var(--ink);font-weight:600}
.flag{font-size:12px;font-weight:650;color:var(--wood-ink);background:var(--wood-soft);padding:3px 8px;border-radius:6px}
.pexp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;padding:16px;border-top:1px solid var(--line)}
.pcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.gargalo{border:1px solid color-mix(in srgb,var(--wood) 45%,transparent);background:var(--wood-soft);color:var(--wood-ink);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.picon path,.picon circle,.picon ellipse{stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.ib{fill:var(--floor);stroke:var(--line)} .if1{fill:var(--navy-soft);stroke:var(--navy)} .if2{fill:color-mix(in srgb,var(--navy) 32%,var(--raise));stroke:var(--navy)}
.if3{fill:var(--raise);stroke:var(--navy)} .if4{fill:none;stroke:var(--navy)} .ileaf{fill:color-mix(in srgb,var(--leaf) 50%,var(--raise));stroke:var(--leaf)}
.iroad{fill:color-mix(in srgb,var(--wall) 55%,var(--raise));stroke:var(--wall)} .ilane{fill:none;stroke:var(--raise);stroke-width:2!important}
.icourt{fill:var(--wood-soft);stroke:var(--wood)} .iline{fill:none;stroke:var(--wood)} .iglow{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:none}

/* disciplinas */
.disc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}

.disc .check{align-items:flex-start}
.disc .check span{display:flex;flex-direction:column;min-width:0;font-size:14px}

.secpick{display:flex;flex-wrap:wrap;gap:6px}

.dtree{display:flex;flex-direction:column;gap:5px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;background:var(--raise)}
.drow.sub{margin-left:22px}
.drow.off{background:transparent}
.drow.off .check{color:var(--muted)}
.drow select{font-size:14px!important;padding:7px 8px!important}
.drow select:disabled{opacity:.4}
.ok-t{color:var(--ok);font-weight:650;font-size:12px}
.xadd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) auto;gap:8px;align-items:end}
.tpl{display:flex;flex-direction:column;gap:6px}
.tpl-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.tpl-row.sub{margin-left:24px}
.tpl-row .inp{font-size:15px;padding:8px 10px}
.retro{display:flex;flex-direction:column;gap:10px;border:1px dashed color-mix(in srgb,var(--wood) 60%,var(--line));border-radius:12px;padding:12px;background:color-mix(in srgb,var(--wood-soft) 45%,var(--raise))}
.hc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hc li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raise);display:flex;flex-direction:column;gap:4px}
.hc-f{grid-template-columns:repeat(3,minmax(0,1fr))}

.prazo span+span{color:var(--muted);font-size:13px}
/* esteira 2D */
.est2d-wrap{overflow-x:auto;border-radius:16px;background:#FCFBF8;border:1px solid #E6E2DA;color-scheme:light;--ink:#1E232B;--muted:#7D838B;--line:#E2DED6;--raise:#FFFFFF;--surface:#F6F4EF;--navy:#28426E;--ok:#3C8A5E;--warn:#B87412;--crit:#C9533A}

.est2d .e2eye{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;fill:#8C9198}

.est2d .e2pill.wait rect{stroke:#E5C48F}.est2d .e2pill.wait text{fill:#B87412}
.est2d .e2pill.need rect{stroke:#D9D5CD}.est2d .e2pill.need text{fill:#8C9198}

.est2d .e2cap{font-size:10px;fill:#8C9198}

.est2d .e2big.o{font-size:16px;font-weight:650}
.est2d .e2resp{font-size:9.6px;fill:#8C9198}
.est2d .e2desc{font-size:10px;fill:#8C9198}
.est2d .e2who{font-size:9.8px;font-weight:700;fill:#28426E}
.est2d .e2who.warn{fill:#C9533A}
.est2d .e2lane{font-size:15px;font-weight:650}
.est2d .e2ln{font-family:var(--font-mono);font-size:10px;font-weight:500;fill:#9AA0A7}

.est2d .e2stt.ok{fill:#3C8A5E}.est2d .e2stt.hold{fill:#B87412}

.est2d .e2chip.ok text{fill:#FFFFFF;font-weight:650}
.est2d .e2chip.ret text{fill:#D0643F}
.est2d .e2more{font-size:9px;fill:#8C9198}
.est2d .e2cx .halo,.est2d .e2halo{fill:#F2B33D;opacity:.22;animation:e2pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.est2d .e2cx.cur .bx{animation:e2bob 2.6s ease-in-out infinite}
@keyframes e2bob{50%{transform:translateY(-2px)}}
@keyframes e2pulse{50%{opacity:.36;transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.est2d .e2cx.cur .bx,.est2d .e2cx .halo,.est2d .e2halo{animation:none}}
.est2d .e2hit{fill:transparent;stroke:none}

<script>
(()=>{'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MIN=6e4,H=36e5,DAY=864e5,MB=1048576;
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile=()=>matchMedia('(max-width:899px)').matches;
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtDay=t=>{const d=new Date(t);return `${WD[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;};
const fmtDT=t=>`${fmtDay(t)} ${hm(t)}`;
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const fmtWhen=t=>sameDay(t,Date.now())?`hoje ${hm(t)}`:fmtDT(t);

const fmtDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};
const dateMs=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).getTime();};
const isoDate=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};

  {id:'lic',nome:'Licitação',disc:'Licitações',n:2,cy:220},

SECTORS.forEach(s=>{SEATS[s.id+'-L']={id:s.id+'-L',setor:s.id,k:'L',i:0};for(let i=1;i<=s.n;i++){SEATS[`${s.id}-A${i}`]={id:`${s.id}-A${i}`,setor:s.id,k:'A',i};SEATS[`${s.id}-B${i}`]={id:`${s.id}-B${i}`,setor:s.id,k:'B',i};}});
const seatsOf=sid=>{const s=SEC[sid],o=[sid+'-L'];for(let i=1;i<=s.n;i++)o.push(`${sid}-A${i}`,`${sid}-B${i}`);return o;};

const PAPEL={lider:'Líder',colaborador:'Colaborador',gestora:'Gestão de projetos',dono:'Proprietário',vendedor:'Comercial',terceirizado:'Terceirizado'};

/* ============ calendário útil ============ */
const parseHM=s=>{const[h,m]=String(s||'0:0').split(':').map(Number);return(h||0)*60+(m||0);};
const dayStart=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
const nextDay=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();};
function isWorkDay(ds){const c=cfg();return c.calendario.dias.includes(new Date(ds).getDay())&&!(c.feriados||[]).includes(isoDate(ds));}
function workIntervals(ds){if(!isWorkDay(ds))return[];return cfg().calendario.intervalos.map(([a,b])=>[ds+parseHM(a)*MIN,ds+parseHM(b)*MIN]).filter(([a,b])=>b>a);}
function addBizF(fn,start,ms){let rem=ms,t=start,ds=dayStart(start);for(let g=0;g<1000;g++){for(const[a,b]of fn(ds)){if(b<=t)continue;const s=Math.max(a,t);if(s+rem<=b)return s+rem;rem-=b-s;}ds=nextDay(ds);t=ds;}return t;}
function bizBetweenF(fn,a,b){if(!(a>0)||b<=a)return 0;let tot=0,ds=dayStart(a);for(let g=0;g<1000&&ds<b;g++){for(const[x,y]of fn(ds)){const s=Math.max(x,a),e=Math.min(y,b);if(e>s)tot+=e-s;}ds=nextDay(ds);}return tot;}
const addBiz=(s,ms)=>addBizF(workIntervals,s,ms),bizBetween=(a,b)=>bizBetweenF(workIntervals,a,b);
/* jornada individual: prazos e aviso de Play seguem o horário de cada pessoa */
const jorDe=p=>{if(p&&p.jornada&&p.jornada.length===4)return p.jornada;const iv=cfg().calendario.intervalos;return[(iv[0]||[])[0]||'08:00',(iv[0]||[])[1]||'12:00',(iv[1]||[])[0]||'13:30',(iv[1]||[])[1]||'18:00'];};
const ausenteEm=(p,ds)=>{const a=p&&p.ausencia;if(!a||!a.de)return false;const d=isoDate(ds);return d>=a.de&&d<=(a.ate||a.de);};
const ausenteHoje=p=>ausenteEm(p,dayStart(Date.now()));
function workIntervalsP(p,ds){if(!isWorkDay(ds)||ausenteEm(p,ds))return[];const j=jorDe(p);return[[j[0],j[1]],[j[2],j[3]]].map(([a,b])=>[ds+parseHM(a)*MIN,ds+parseHM(b)*MIN]).filter(([a,b])=>b>a);}
const addBizP=(p,s,ms)=>addBizF(ds=>workIntervalsP(p,ds),s,ms),bizBetweenP=(p,a,b)=>bizBetweenF(ds=>workIntervalsP(p,ds),a,b);
function limiteSessao(p,now){const ints=workIntervalsP(p,dayStart(now));
  for(let i=0;i<ints.length;i++){const[a,b]=ints[i];if(now>=a&&now<b)return{lim:b,mot:i===ints.length-1?'PAUSE_SHIFT_END':'PAUSE_BREAK',fora:false};}
  return{lim:now+(Number(cfg().tetoForaHoras)||4)*H,mot:'PAUSE_SAFETY_LIMIT',fora:true};
}

const runningOf=(m,now=Date.now())=>{const s=m&&m.sessoes&&m.sessoes[m.sessoes.length-1];return s&&s.fim==null&&now<s.lim?s:null;};
const sessMot=(s,now=Date.now())=>s.fim==null?(now<s.lim?null:s.limMot):(s.fim>=s.lim?s.limMot:s.mot);
const PZC=new Map();
function prazoDe(m){if(!m)return null;const p=pessoa(m.pessoa);
  if(m.prazoData){const ini=m.criadaEm||Date.now(),fim=dateMs(m.prazoData)+parseHM(jorDe(p)[3])*MIN;return{ini,fim,alerta:ini+Math.max(0,fim-ini)*0.7,data:true};}
  if(!(m.prazoHoras>0))return null;let ini=m.inicioPrazo;
  if(!ini){if(!OPEN.includes(m.status))return null;if(!isTerc(p)){const a=atualDe(m.pessoa);if(!a||a.id!==m.id)return null;}ini=m.criadaEm||Date.now();}
  const k=[m.id,ini,m.prazoHoras,JSON.stringify(jorDe(p)),JSON.stringify(p&&p.ausencia||null),JSON.stringify(cfg().calendario),(cfg().feriados||[]).join()].join('|');
  let z=PZC.get(k);if(!z){const h=m.prazoHoras*H;z={ini,alerta:addBizP(p,ini,h*0.7),fim:addBizP(p,ini,h)};if(PZC.size>3000)PZC.clear();PZC.set(k,z);}return z;}
function prazoSt(m,now=Date.now()){const z=prazoDe(m);if(!z)return 'verde';if(now>=z.fim)return 'vermelho';if(now>=z.alerta)return 'laranja';return 'verde';}

function gapPlay(pid,now=Date.now()){const p=pessoa(pid);if(!p||!p.nome||p.papel==='terceirizado')return null;const m=atualDe(pid);if(!m||runningPessoa(pid))return null;
  let la=0,mot=null;for(const o of Object.values(S.missoes))if(o.pessoa===pid)for(const s of o.sessoes||[]){if(s.fim==null&&now<s.lim)return null;const e=sessEnd(s,now);if(e>la){la=e;mot=sessMot(s,now);}}
  const z=prazoDe(m),base=Math.max(la,p.atualDesde||(z?z.ini:(m.criadaEm||0)));if(!(base>0))return null;
  const ms=bizBetweenP(p,base,now);if(ms<Math.max(tolPlay(),MIN))return null;
  const seg=workIntervalsP(p,dayStart(now)).find(([a,b])=>now>=a&&now<b)||null;
  return{ms,base,ini:addBizP(p,base,0),tipo:la&&la===base&&mot==='PAUSE_MANUAL'&&seg&&la>=seg[0]?'pausa':'inicio',seg,missao:m.id};}

function prazoTxt(m,now=Date.now()){const z=prazoDe(m),p=pessoa(m.pessoa),corr=m.status==='correcao'?' · prazo original mantido':'';
  if(z&&z.data){const d=Math.round((dayStart(z.fim)-dayStart(now))/DAY);return now>=z.fim?{l:`Atrasada · entrega era ${fmtDate(m.prazoData)}`,s:`${-d||0} ${plural(-d,'dia','dias')} de atraso · terceirizado`}:{l:`Entrega prevista ${fmtDate(m.prazoData)}`,s:d===0?'Vence hoje · terceirizado':`Faltam ${d} ${plural(d,'dia','dias')} · terceirizado`};}

}

/* ============ cena isométrica ============ */
const ISO=(()=>{
  const SC=0.172,C=Math.cos(Math.PI/6),W=1500,D=2500,HW=420,OX=40+W*C*SC,OY=100;
  const P=(x,y,z)=>{const u=W-x;return[OX+(y-u)*C*SC,OY+(u+y)*0.5*SC-z*SC];};
  const r1=v=>Math.round(v*10)/10;
  const pts=a=>a.map(p=>r1(p[0])+','+r1(p[1])).join(' ');
  const poly=(a,f,x='')=>`<polygon points="${pts(a)}" fill="${f}"${x}/>`;
  const FLOOR='#D8D5CE',FE1='#B4B0A7',FE2='#9F9B92',JOINT='#C6C2BA',WALL='#8E9B9A',CAPC='#6B7675',COURSE='#7E8B8A',PIL='#7A8685';
  const DK=['#2A2C30','#1B1C1F','#141517'],DIV=['#45484E','#33363B','#2B2D31'],CH=['#3A3C41','#242529','#1C1D20'];
  const MON_T='#2B2D31',MON_L='#18191C',MON_F='#111214',SCR_ON='#8CC6FF',SCR_OFF='#33414F';
  const WDC=['#B4865A','#93683F','#7B5533'],OSB=['#E2C38A','#CDA766','#B89352'],DOOR=['#A0703F','#82552D','#6E4625'];
  const PERS=['#6F89A6','#506A87','#445C77'];
  const STC={verde:['#4CB57A','#33905A','#2A7A4C'],laranja:['#F39C43','#D27A27','#B8661D'],vermelho:['#E45B50','#BF3F36','#A5342C'],sem:['#E482BA','#C6609B','#AC5086'],vaga:['#3A3C41','#26282C','#1E2023'],neutro:['#6E7278','#585C62','#4C5056']};
  const PADC={verde:'#2E9B5C',laranja:'#E57F1B',vermelho:'#D33F33',sem:'#D45A9E',vaga:'#9AA3A0',neutro:'#DCE0DC'};
  const GH=['#EEF0ED','#E1E4E0','#D7DAD6'];
  let boxes,grp,G=false;
  const box=(x0,x1,y0,y1,z0,z1,c)=>(grp||boxes).push({x0,x1,y0,y1,z0,z1,c:G?GH:c});
  const raw=h=>{if(grp)grp.push({raw:h});};
  const begin=()=>{grp=[];};
  const end=()=>{const g=grp;grp=null;const b=g.filter(p=>!p.raw);if(!b.length)return;
    boxes.push({x0:Math.min(...b.map(p=>p.x0)),x1:Math.max(...b.map(p=>p.x1)),y0:Math.min(...b.map(p=>p.y0)),y1:Math.max(...b.map(p=>p.y1)),z0:Math.min(...b.map(p=>p.z0)),z1:Math.max(...b.map(p=>p.z1)),parts:g});};
  function drawBox(b){
    if(b.parts)return b.parts.map(p=>p.raw?p.raw:drawBox(p)).join('');
    const{x0,x1,y0,y1,z0,z1,c}=b;
    return poly([P(x0,y0,z0),P(x0,y1,z0),P(x0,y1,z1),P(x0,y0,z1)],c[1])+poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],c[2])+poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],c[0]);
  }
  function behind(a,b){const xa=a.x0>=b.x1,ya=a.y1<=b.y0,xb=b.x0>=a.x1,yb=b.y1<=a.y0;if(xa||ya)return!(xb||yb);if(xb||yb)return false;return a.z1<=b.z0+.01&&!(b.z1<=a.z0+.01);}
  function sb(b){let a=1e9,c=-1e9,d=1e9,e=-1e9;for(const x of[b.x0,b.x1])for(const y of[b.y0,b.y1])for(const z of[b.z0,b.z1]){const p=P(x,y,z);a=Math.min(a,p[0]);c=Math.max(c,p[0]);d=Math.min(d,p[1]);e=Math.max(e,p[1]);}return[a,c,d,e];}
  function order(bs){
    const n=bs.length,r=bs.map(sb),ed=bs.map(()=>[]),deg=new Array(n).fill(0);
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      if(r[i][1]<r[j][0]-.3||r[j][1]<r[i][0]-.3||r[i][3]<r[j][2]-.3||r[j][3]<r[i][2]-.3)continue;
      if(behind(bs[i],bs[j])){ed[i].push(j);deg[j]++;}else if(behind(bs[j],bs[i])){ed[j].push(i);deg[i]++;}
    }
    const key=i=>-bs[i].x1+bs[i].y0,ready=[],out=[];
    for(let i=0;i<n;i++)if(!deg[i])ready.push(i);
    while(ready.length){let k=0;for(let q=1;q<ready.length;q++)if(key(ready[q])<key(ready[k]))k=q;const i=ready.splice(k,1)[0];out.push(i);for(const j of ed[i])if(--deg[j]===0)ready.push(j);}
    if(out.length<n){const seen=new Set(out);for(let i=0;i<n;i++)if(!seen.has(i))out.push(i);}
    return out.map(i=>bs[i]);
  }
  function monitor(cx,y0,y1,lit){box(cx-4,cx+4,y0,y1,75,80,[MON_T,MON_L,MON_F]);box(cx-28,cx+28,y0,y1,80,114,[MON_T,MON_L,lit===null?MON_F:(lit?SCR_ON:SCR_OFF)]);}
  function monitorX(x0,x1,cy,lit){box(x0,x1,cy-4,cy+4,75,80,[MON_T,MON_L,MON_F]);box(x0,x1,cy-28,cy+28,80,114,[MON_T,lit?SCR_ON:SCR_OFF,MON_F]);}
  function chair(cx,cy,back,person){
    begin();
    box(cx-20,cx+20,cy-20,cy+20,0,4,CH);box(cx-4,cx+4,cy-4,cy+4,4,40,CH);box(cx-22,cx+22,cy-22,cy+22,40,48,CH);
    const bk=()=>{if(back==='n')box(cx-22,cx+22,cy-28,cy-22,48,92,CH);else if(back==='s')box(cx-22,cx+22,cy+22,cy+28,48,92,CH);else if(back==='w')box(cx-28,cx-22,cy-22,cy+22,48,92,CH);else box(cx+22,cx+28,cy-22,cy+22,48,92,CH);};
    const tr=()=>{if(!person)return;let t;if(back==='n')t=[cx-13,cx+13,cy-18,cy-2];else if(back==='s')t=[cx-13,cx+13,cy+2,cy+18];else if(back==='w')t=[cx-18,cx-2,cy-13,cy+13];else t=[cx+2,cx+18,cy-13,cy+13];box(t[0],t[1],t[2],t[3],48,97,PERS);};
    const hd=()=>{if(!person)return;const o={n:[0,-10],s:[0,10],w:[-10,0],e:[10,0]}[back];const p=P(cx+o[0],cy+o[1],112);raw(`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="2.2" fill="${G?'#E8EAE7':'#DCD6CC'}" stroke="${G?'#CDD1CD':'#8D887F'}" stroke-width=".35"/>`);};
    if(back==='n'||back==='e'){bk();tr();}else{tr();bk();}
    hd();end();
  }
  function slab(x0,x1,y0,y1,ax,topC){begin();if(ax==='y'){box(x0+4,x1-4,y0,y0+5,0,70,WDC);box(x0+4,x1-4,y1-5,y1,0,70,WDC);}else{box(x1-5,x1,y0+4,y1-4,0,70,WDC);box(x0,x0+5,y0+4,y1-4,0,70,WDC);}box(x0,x1,y0,y1,70,75,topC||WDC);end();}
  function room(x0,y0,w,d){
    const t=10,CUT=140,gm=y0+d/2,g0=gm-92,g1=gm+92;
    box(x0,x0+w,y0,y0+t,0,CUT,OSB);
    box(x0+w-t,x0+w,y0+t,g0-8,0,CUT,OSB);box(x0+w-t,x0+w,g1+8,y0+d-t,0,CUT,OSB);
    box(x0+w-t-2,x0+w,g0-8,g0,0,200,DOOR);box(x0+w-t-2,x0+w,g1,g1+8,0,200,DOOR);box(x0+w-t-2,x0+w,g0-8,g1+8,200,212,DOOR);
    box(x0,x0+t,y0+t,y0+d,0,CUT,OSB);box(x0+t,x0+w,y0+d-t,y0+d,0,CUT,OSB);
    box(x0+w-t+1,x0+w-1,g0,g1,0,3,['#C9B48F','#B39C74','#9E8862']);
    box(x0+w,x0+w+86,g0,g0+5,0,196,['#C79A68','#A97D4E','#8F6840']);box(x0+w,x0+w+86,g1-5,g1,0,196,['#C79A68','#A97D4E','#8F6840']);
    begin();box(x0+190,x0+210,y0+140,y0+160,0,70,WDC);box(x0+110,x0+290,y0+110,y0+190,70,75,WDC);end();
    for(const cx of[x0+150,x0+250]){chair(cx,y0+80,'n',null);chair(cx,y0+220,'s',null);}
  }
  function pill(x,y,text,o){const w=text.length*(o.fs*0.6)+o.fs*1.4,h=o.fs*1.65;
    return `<g class="${o.cls||''}"${o.attr||''}><rect x="${r1(x-w/2)}" y="${r1(y-h/2)}" width="${r1(w)}" height="${r1(h)}" rx="${o.round?r1(h/2):3}" fill="${o.bg}" ${o.stroke?`stroke="${o.stroke}" stroke-width=".5"`:''}/><text x="${r1(x)}" y="${r1(y)}" text-anchor="middle" dominant-baseline="central" font-size="${o.fs}" font-weight="650" fill="${o.fg}">${esc(text)}</text></g>`;}
  function sectorBox(sid){const s=SEC[sid];let a=1e9,c=-1e9,d=1e9,e=-1e9;for(const x of[s.x0-150,1500])for(const y of[s.cy-175,s.cy+175])for(const z of[0,410]){const p=P(x,y,z);a=Math.min(a,p[0]);c=Math.max(c,p[0]);d=Math.min(d,p[1]);e=Math.max(e,p[1]);}return{x:a-6,y:d-4,w:c-a+12,h:e-d+10};}
  const VB={x:18,y:24,w:644,h:432};

  function build(o){
    boxes=[];grp=null;const fl=[],wl=[],pads=[],top=[],tags=[],hits=[];
    // piso
    const sl=18;
    fl.push(poly([P(0,0,0),P(0,D,0),P(0,D,-sl),P(0,0,-sl)],FE1),poly([P(0,D,0),P(W,D,0),P(W,D,-sl),P(0,D,-sl)],FE2),poly([P(0,0,0),P(W,0,0),P(W,D,0),P(0,D,0)],FLOOR));
    for(let y=500;y<D;y+=500){const a=P(0,y,0),b=P(W,y,0);fl.push(`<line x1="${r1(a[0])}" y1="${r1(a[1])}" x2="${r1(b[0])}" y2="${r1(b[1])}" stroke="${JOINT}" stroke-width=".8"/>`);}
    for(const x of[500,1000]){const a=P(x,0,0),b=P(x,D,0);fl.push(`<line x1="${r1(a[0])}" y1="${r1(a[1])}" x2="${r1(b[0])}" y2="${r1(b[1])}" stroke="${JOINT}" stroke-width=".8"/>`);}
    // paredes
    const T=20;
    wl.push(poly([P(0,0,0),P(W,0,0),P(W,0,HW),P(0,0,HW)],WALL),poly([P(W,0,0),P(W,D,0),P(W,D,HW),P(W,0,HW)],WALL));
    for(let z=40;z<HW;z+=40){const a=P(0,0,z),b=P(W,0,z),c=P(W,D,z);wl.push(`<polyline points="${pts([a,b,c])}" fill="none" stroke="${COURSE}" stroke-width=".5"/>`);}
    for(let y=500;y<=D;y+=500)wl.push(poly([P(W,y-14,0),P(W,Math.min(y+14,D),0),P(W,Math.min(y+14,D),HW),P(W,y-14,HW)],PIL));
    for(let x=500;x<W;x+=500)wl.push(poly([P(x-14,0,0),P(x+14,0,0),P(x+14,0,HW),P(x-14,0,HW)],PIL));
    wl.push(poly([P(-T,-T,HW),P(W+T,-T,HW),P(W,0,HW),P(0,0,HW)],CAPC),poly([P(W,0,HW),P(W+T,-T,HW),P(W+T,D,HW),P(W,D,HW)],CAPC),poly([P(-T,-T,0),P(0,0,0),P(0,0,HW),P(-T,-T,HW)],CAPC),poly([P(W,D,0),P(W+T,D,0),P(W+T,D,HW),P(W,D,HW)],CAPC));
    const pad=(x0,x1,y0,y1,st)=>{const a=[P(x0,y0,.5),P(x1,y0,.5),P(x1,y1,.5),P(x0,y1,.5)];pads.push(st==='vaga'?poly(a,'none',` stroke="${PADC.vaga}" stroke-width="1.1" stroke-dasharray="3 2"`):poly(a,PADC[st],` fill-opacity=".55"`));};
    const hit=(id,x0,x1,y0,y1,label)=>{hits.push(`<polygon class="hit" data-posto="${id}" tabindex="0" role="button" aria-label="${esc(label)}" points="${pts([P(x0,y0,60),P(x1,y0,60),P(x1,y1,60),P(x0,y1,60)])}"/>`);};
    const outline=(x0,x1,y0,y1,z)=>`<polygon points="${pts([P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)])}" fill="none" stroke="#1C3A5F" stroke-width="1.5" stroke-linejoin="round"/>`;
    const overlay=(id,cx,cy,info,inS)=>{
      if(!inS)return;
      if(info.amp){const p=P(cx,cy,150);top.push(`<g class="ovl bdg"><circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="4.6" fill="#1C3A5F" stroke="#FFFFFF" stroke-width=".8"/><path d="M${r1(p[0]-1.9)} ${r1(p[1]-2.5)}h3.8l-3.8 5h3.8z" fill="none" stroke="#FFFFFF" stroke-width=".8" stroke-linejoin="round"/></g>`);}
      if(info.run){const p=P(cx,cy,info.amp?172:150);top.push(`<circle class="ovl rundot bdg" cx="${r1(p[0])}" cy="${r1(p[1])}" r="2.4" fill="#2F80ED" stroke="#FFFFFF" stroke-width=".6"/>`);}
      else if(info.sp){const p=P(cx,cy,info.amp?196:172),x=r1(p[0]),y=r1(p[1]),c=info.sp==='pausa'?'#D06C0E':'#C8392E';top.push(`<g class="ovl bdg spb"><circle cx="${x}" cy="${y}" r="4.6" fill="${c}" stroke="#FFFFFF" stroke-width=".8"/><path d="M${r1(p[0]-1.1)} ${r1(p[1]-2)}v4M${r1(p[0]+1.1)} ${r1(p[1]-2)}v4" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/></g>`);}
      if(info.nome){const p=P(cx,cy,128);top.push(`<text class="nm" x="${r1(p[0])}" y="${r1(p[1]-4)}">${esc(curto(info.nome))}</text>`);}
    };
    const seatInfo=id=>o.seats[id]||{st:'vaga'};
    for(const s of SECTORS){
      const x0=s.x0,x1=X1,cy=s.cy,inS=!o.scope||o.scope===s.id;G=!inS;
      const st=id=>{const v=seatInfo(id).st;return inS?v:(v==='vaga'?'vaga':'neutro');};
      const L=s.id+'-L',li=seatInfo(L);
      // mesa do líder (cabeceira)
      begin();box(x0-62,x0-57,cy-46,cy+46,0,70,DK);box(x0-62,x0-2,cy-50,cy+50,70,75,STC[st(L)]);monitorX(x0-30,x0-26,cy,inS&&li.run);end();
      // mesa principal
      begin();
      box(x1-5,x1,cy-66,cy+66,0,70,DK);for(let k=s.n-1;k>=1;k--){const lx=x0+k*PW;box(lx-2,lx+2,cy-66,cy+66,0,70,DK);}box(x0,x0+5,cy-66,cy+66,0,70,DK);
      for(let i=s.n-1;i>=0;i--)box(x0+i*PW,x0+(i+1)*PW,cy-70,cy-2,70,75,STC[st(`${s.id}-A${i+1}`)]);
      for(let i=s.n-1;i>=0;i--)monitor(x0+i*PW+PW/2,cy-30,cy-26,null);

      for(let i=s.n-1;i>=0;i--)box(x0+i*PW,x0+(i+1)*PW,cy+2,cy+70,70,75,STC[st(`${s.id}-B${i+1}`)]);

      for(let i=0;i<s.n;i++){

          if(inS&&(inf.nome||o.hitVagas)){hit(id,x0+i*PW,x0+(i+1)*PW,ya[0],ya[1],`${inf.nome||'Baia vaga'}, ${o.secName[s.id]}, ${SIT[inf.st]||''}${inf.amp?', entrega aguardando validação':''}${inf.run?', cronômetro ligado':''}${inf.sp==='inicio'?', sem Play no horário':inf.sp==='pausa'?', pausado no horário':''}`);}
          if(o.sel===id){top.push(outline(x0+i*PW+2,x0+(i+1)*PW-2,k==='A'?cy-68:cy+4,k==='A'?cy-4:cy+68,75.5),outline(x0+i*PW+4,x0+i*PW+PW-4,k==='A'?cy-146:cy+74,k==='A'?cy-74:cy+146,.6));}
        }
      }
      pad(x0-128,x0-66,cy-50,cy+50,st(L));
      chair(x0-95,cy,'w',li.nome?1:null);
      overlay(L,x0-95,cy,li,inS);
      if(inS&&(li.nome||o.hitVagas))hit(L,x0-140,x0-2,cy-56,cy+56,`${li.nome||'Cabeceira vaga'}, líder da ${o.secName[s.id]}, ${SIT[li.st]||''}${li.amp?', entrega aguardando validação':''}${li.run?', cronômetro ligado':''}${li.sp==='inicio'?', sem Play no horário':li.sp==='pausa'?', pausado no horário':''}`);
      if(o.sel===L)top.push(outline(x0-60,x0-4,cy-48,cy+48,75.5),outline(x0-128,x0-66,cy-50,cy+50,.6));

const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result);res(s.slice(s.indexOf(',')+1));};r.onerror=()=>rej(r.error);r.readAsDataURL(f);});
async function addFiles(mid,files){
  if(!S.cap.assets){setMsg('err',mid,'Seu acesso não permite enviar arquivos. Peça ao administrador para te convidar como Editor.');render();return;}
  for(const f of files){
    const ext=(f.name.includes('.')?f.name.split('.').pop().toLowerCase():'').slice(0,8)||'arq';
    if(!f.size){setMsg('err',mid,`“${f.name}” está vazio.`);render();continue;}
    const pdf=ext==='pdf',lim=pdf?20*MB:14*MB;
    if(f.size>lim){setMsg('err',mid,`“${f.name}” tem ${fmtSize(f.size)}. O limite é ${pdf?'20 MB para PDF':'14 MB'}. Suba no Drive e use “Adicionar link do Drive”.`);render();continue;}
    S.uploading[mid]=(S.uploading[mid]||0)+1;setMsg('err',mid,null);render();
    try{
      const raw=pdf||!!S.cap.fb;const res=raw?await S.cap.assets.upload(f,{type:pdf?'application/pdf':(f.type||'application/octet-stream')}):await S.cap.assets.upload(new Blob([await b64(f)],{type:'text/plain'}),{type:'text/plain'});
      const item={id:res.id,nome:f.name,ext,tamanho:f.size,enc:raw?'raw':'b64',em:Date.now(),por:myPid()||'admin'};
      await act(()=>withLock('a-'+mid,async()=>{const m=await getM(mid);if(!m)return;await D('missoes/'+mid).update({anexos:[...(m.anexos||[]),item]});}));
      setMsg('ok',mid,`“${f.name}” anexado.`);
    }catch(e){console.error(e);const c=e&&e.code;setMsg('err',mid,c==='too_large'?`“${f.name}” passou do limite de tamanho.`:c==='quota_or_state'?'O espaço de arquivos do sistema acabou. Avise o administrador.':c==='not_granted'||c==='capability_disabled'?'Envio de arquivos indisponível para o seu acesso.':`Não foi possível enviar “${f.name}”. Tente de novo.`);}
    finally{S.uploading[mid]--;render();}
  }
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};})();
function makeZip(name,data){const enc=new TextEncoder().encode(name),crc=CRC(data),d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,enc.length,true);lh.setUint16(28,0,true);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,enc.length,true);ch.setUint32(42,0,true);
  const off=30+enc.length+data.length,eo=new DataView(new ArrayBuffer(22));eo.setUint32(0,0x06054b50,true);eo.setUint16(8,1,true);eo.setUint16(10,1,true);eo.setUint32(12,46+enc.length,true);eo.setUint32(16,off,true);
  return new Blob([lh.buffer,enc,data,ch.buffer,enc,eo.buffer]);}
async function baixar(a){

    if(a.enc==='raw'){await S.cap.downloads.save({filename:a.nome,data:await r.blob()});}
    else{const txt=(await r.text()).trim();const bin=atob(txt);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await S.cap.downloads.save({filename:a.nome+'.zip',data:makeZip(a.nome,u)});}
  }catch(e){const c=e&&e.code;if(c==='declined')return;console.error(e);toast(c==='rate_limited'?'Já existe um download aguardando confirmação.':'Não foi possível baixar este arquivo agora.');}
}

}

const COLS_DADOS=['pessoas','projetos','missoes','entregas','conclusoes','avisos','comentarios','atrasos','config'];
const NOME_COL={pessoas:'pessoas',projetos:'projetos',missoes:'missões',entregas:'entregas',conclusoes:'conclusões',avisos:'avisos',comentarios:'comentários',atrasos:'atrasos',config:'configurações'};
async function exportarDados(){if(!S.cap.db)return;S.ui.dados={...(S.ui.dados||{}),exp:true};render();
  try{const out={sistema:'voltra',versao:1,exportadoEm:Date.now(),colecoes:{}};
    for(const c of COLS_DADOS){const sn=await Col(c).get();out.colecoes[c]=Object.fromEntries(sn.docs.filter(d=>!(c==='config'&&d.id==='setup')).map(d=>[d.id,d.data()]));}
    const blob=new Blob([JSON.stringify(out)],{type:'application/json'}),nome=`voltra-dados-${isoDate(Date.now())}.json`;
    if(S.cap.fb){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
    else if(S.cap.downloads)await S.cap.downloads.save({filename:nome,data:blob});
    else{toast('Download indisponível nesta visualização.');return;}
    toast('Cópia dos dados baixada: '+nome);
  }catch(e){console.error(e);toast('Não foi possível baixar a cópia agora.');}
  finally{S.ui.dados={...(S.ui.dados||{}),exp:false};render();}}
async function lerDados(f){if(!f)return;S.ui.dados={nome:f.name};
  try{const j=JSON.parse(await f.text());if(!j||j.sistema!=='voltra'||!j.colecoes||typeof j.colecoes!=='object')throw new Error('formato');
    const partes=COLS_DADOS.filter(c=>j.colecoes[c]&&Object.keys(j.colecoes[c]).length).map(c=>`${Object.keys(j.colecoes[c]).length} ${NOME_COL[c]}`);
    if(!partes.length)throw new Error('vazio');
    S.ui.dados={nome:f.name,j,resumo:`Arquivo de ${fmtDate(isoDate(j.exportadoEm||Date.now()))}: ${partes.join(', ')}.`};
  }catch(e){S.ui.dados={nome:f.name,erro:'Esse arquivo não é uma cópia dos dados da Voltra.'};}
  render();}
async function importarDados(){const st=S.ui.dados;if(!st||!st.j||!S.cap.fb)return;st.imp=true;st.prog='';render();

  render();}

function pjRows(pr,extras){const tpl=tplDisc(),ex=(pr&&pr.disciplinas)||[],rows=[],seen=new Set();
  for(const t of tpl){const e=ex.find(x=>x.id===t.id);rows.push({...t,...(e||{}),inProj:!!e});seen.add(t.id);}
  for(const e of ex)if(!seen.has(e.id)){rows.push({...e,inProj:true});seen.add(e.id);}
  for(const x of extras)if(!seen.has(x.id))rows.push({...x,inProj:false,extra:true});
  return orderTree(rows);}

  {k:'briefing',n:'Briefing',pref:true,d:'Levanta o programa e as necessidades'},

  {k:'complementares',n:'Complementares',d:'Uma esteira por empresa, em paralelo. Só seguem juntas para a compatibilização.'},

  {k:'orcamento',n:'Orçamento',pref:true,ret:true,d:'Planilha master validada com a prefeitura'},

const etNome=k=>k==='fim'?'Concluído':ETK[k]?ETK[k].n:'—';
const etNomeHTML=k=>k==='compatibilizacao'?'Compati&shy;bilização':esc(etNome(k));

  {id:'c-3d',nome:'Maquete eletrônica (3D)',pai:'e-concepcao',setor:'lard'},{id:'dimg',nome:'Imagens e renders',pai:'e-concepcao',setor:'lard'},

  {id:'d4',nome:'Elétrico',pai:'e-complementares',setor:'max'},{id:'d4-1',nome:'SPDA',pai:'d4',setor:'max'},{id:'c-ilum',nome:'Iluminação',pai:'d4',setor:'max'},{id:'c-log',nome:'Lógica e cabeamento',pai:'d4',setor:'max'},MP('c-mp-ele','d4','max'),
  {id:'g-hid',nome:'Hidráulico',pai:'e-complementares',setor:'flx',grupo:true},{id:'d3',nome:'Hidrossanitário',pai:'g-hid',setor:'flx'},{id:'d3-1',nome:'Drenagem',pai:'g-hid',setor:'flx'},MP('c-mp-hid','g-hid','flx'),
  {id:'d6',nome:'Estrutural',pai:'e-complementares',setor:'flx'},MP('c-mp-est','d6','flx'),
  {id:'d5',nome:'Bombeiro (PPCI)',pai:'e-complementares',setor:'flx'},MP('c-mp-ppci','d5','flx'),
  {id:'c-terra',nome:'Corte e aterro (terraplanagem)',pai:'e-complementares',setor:'flx'},MP('c-mp-ter','c-terra','flx'),

  {id:'d9',nome:'Sinalização viária',pai:'e-complementares',setor:'flx'},MP('c-mp-sin','d9','flx'),
  {id:'g-arq',nome:'Arquitetura complementar',pai:'e-complementares',setor:'isen',grupo:true},{id:'c-det',nome:'Detalhamento',pai:'g-arq',setor:'isen'},{id:'c-ace',nome:'Acessibilidade',pai:'g-arq',setor:'isen'},{id:'c-pai',nome:'Paisagismo',pai:'g-arq',setor:'isen'},{id:'c-cv',nome:'Comunicação visual',pai:'g-arq',setor:'isen'},MP('c-mp-arq','g-arq','isen'),
  {id:'d10',nome:'Ar-condicionado (mecânico)',pai:'e-complementares',setor:null},MP('c-mp-ar','d10',null),
  {id:'cmp',nome:'Compatibilização dos projetos',pai:'e-compatibilizacao'},
  {id:'d7',nome:'Planilha orçamentária master',pai:'e-orcamento'},

  {id:'og-prot',nome:'Protocolo no órgão',pai:'e-orgao'},{id:'og-apr',nome:'Aprovação do órgão',pai:'e-orgao'}];

const estTpl=()=>{const t=S.config&&S.config.esteiraTpl;return Array.isArray(t)&&t.length?t:DEF_EST;};
const respPadrao=()=>{const o={};for(const[k,v]of Object.entries(DEF_RESP))if(pessoa(v)&&pessoa(v).nome)o[k]=v;const c=S.config&&S.config.respPadrao;if(c)for(const[k,v]of Object.entries(c))o[k]=v||null;return o;};

const estAtual=pr=>ES(pr).estacao||null;
const checavel=x=>!!x&&!x.grupo&&!x.etapa;

/* árvore: ordem, profundidade, numeração, etapa de cada item e "feito efetivo" */
const EC=new WeakMap();
function estT(pr){let t=EC.get(pr);if(t)return t;
  const list=(pr&&pr.disciplinas)||[];const by=new Map(list.map(x=>[x.id,x]));
  for(const e of ETAPAS)if(!by.has('e-'+e.k))by.set('e-'+e.k,{id:'e-'+e.k,nome:e.n,pai:null,grupo:true,etapa:e.k});
  const kids=new Map();
  for(const x of list){if(x.etapa)continue;const p=x.pai&&by.has(x.pai)&&x.pai!==x.id?x.pai:'e-complementares';if(!kids.has(p))kids.set(p,[]);kids.get(p).push(x);}
  const order=[],depth=new Map(),cod=new Map(),etp=new Map(),seen=new Set();
  const walk=(x,d,c,k)=>{if(seen.has(x.id))return;seen.add(x.id);order.push(x);depth.set(x.id,d);cod.set(x.id,c);etp.set(x.id,k);(kids.get(x.id)||[]).forEach((y,i)=>walk(y,d+1,c+'.'+(i+1),k));};
  ETAPAS.forEach((e,i)=>walk(by.get('e-'+e.k),0,String(i+1),e.k));
  const fe=new Map();const ef=id=>{if(fe.has(id))return fe.get(id);fe.set(id,false);const x=by.get(id);if(!x)return false;const ch=kids.get(id)||[];
    const v=(x.grupo||x.etapa)?ch.every(c=>ef(c.id)):(!!x.feito&&ch.every(c=>ef(c.id)));fe.set(id,v);return v;};
  t={by,kids,order,depth,cod,etp,ef};EC.set(pr,t);return t;}
function renumerar(ds){const t=estT({disciplinas:ds});for(const x of ds){const c=t.cod.get(x.id);if(c)x.cod=c;}return ds;}
function estAvanco(pr){const c=estT(pr).order.filter(checavel);return c.length?Math.round(c.filter(x=>x.feito).length/c.length*100):0;}
function itensDaEtapa(pr,k){const t=estT(pr);return t.order.filter(x=>checavel(x)&&t.etp.get(x.id)===k);}
function subarvore(pr,id){const t=estT(pr),out=[];const go=i=>{for(const c of t.kids.get(i)||[]){out.push(c);go(c.id);}};go(id);return out;}
function liberado(pr,id){const t=estT(pr),k=t.etp.get(id),cur=estAtual(pr);if(!cur||cur==='fim')return true;if(etIdx(k)<=etIdx(cur))return true;
  const ad=new Set((ES(pr).adiantados||[]).map(a=>a.id));let cid=id;for(let g=0;g<20&&cid;g++){if(ad.has(cid))return true;const x=t.by.get(cid);if(!x||x.etapa)break;cid=x.pai&&t.by.has(x.pai)?x.pai:'e-'+k;}return false;}
const temAdiantado=(pr,k)=>(ES(pr).adiantados||[]).some(a=>estT(pr).etp.get(a.id)===k);
function prefInfo(pr,k){if(!ETK[k]||!ETK[k].pref)return null;const p=((ES(pr).est||{})[k]||{}).pref||null;const cur=estAtual(pr);
  if(p&&p.okEm)return{st:'ok',p};if(cur&&etIdx(k)<etIdx(cur)&&!pendEt(pr,k))return{st:'ok',p:p||{},implicito:true};if(p&&p.enviadoEm)return{st:'wait',p};return{st:'need',p:null};}
function podePassar(pr){const k=estAtual(pr);if(!k)return{ok:false,m:'Posicione o projeto na esteira primeiro.'};if(k==='fim')return{ok:false,m:'Projeto concluído.'};
  const t=estT(pr);const falta=itensDaEtapa(pr,k).filter(x=>!t.ef(x.id)).length;
  if(falta)return{ok:false,m:`${falta===1?'Falta':'Faltam'} ${falta} ${plural(falta,'item','itens')} nesta etapa.`};
  const pf=prefInfo(pr,k);if(pf&&pf.st!=='ok')return{ok:false,m:'Falta registrar o OK da prefeitura.'};return{ok:true};}
const respDe=(pr,k)=>(ES(pr).resp||{})[k]||null;
function lanesDe(pr){const t=estT(pr),tops=t.kids.get('e-complementares')||[];
  const L=LANES.map(l=>({...l,tops:tops.filter(c=>c.setor===l.s)}));
  for(const s of [...new Set(tops.map(c=>c.setor).filter(s=>s&&!LANES.some(l=>l.s===s)))])L.push({s,n:(SEC[s]&&SEC[s].disc)||'',tops:tops.filter(c=>c.setor===s)});
  const semEq=tops.filter(c=>!c.setor);if(semEq.length)L.push({s:'',n:'Equipe a definir',tops:semEq});
  return L.filter(l=>l.tops.length).map(l=>{const its=l.tops.flatMap(x=>[x,...subarvore(pr,x.id)]).filter(checavel);return{...l,its,nt:its.length,nd:its.filter(x=>x.feito).length,done:l.tops.every(x=>t.ef(x.id))};});}
const PVC=new WeakMap();
function previewOf(pr){let v=PVC.get(pr);if(v)return v;v={...pr,disciplinas:converterItens(pr.disciplinas||[]),esteira:{v:1,origem:'existente',estacao:null,resp:respPadrao(),est:{},adiantados:[],eventos:[]},_preview:true};PVC.set(pr,v);return v;}
const pessoasResp=()=>Object.values(S.pessoas).filter(p=>p.nome&&p.papel!=='terceirizado').sort((a,b)=>a.nome.localeCompare(b.nome));
const respOpt=(sel)=>`<option value="">A definir</option>${pessoasResp().map(p=>`<option value="${esc(p.id)}" ${sel===p.id?'selected':''}>${esc(p.nome)}${p.setor?' · '+esc(secNome(p.setor)):p.papel?' · '+esc(PAPEL[p.papel]||''):''}</option>`).join('')}`;
const podeGerirEst=()=>canAdmin();
function podeMarcar(pr,x){if(pr._preview||!checavel(x)||!liberado(pr,x.id))return false;if(canAdmin())return true;const m=me();if(!m)return false;
  if(m.papel==='lider'&&x.setor&&x.setor===m.setor)return true;return respDe(pr,estT(pr).etp.get(x.id))===m.id;}

const WORKER=(c='#24334A')=>`<svg class="wk" viewBox="0 0 40 52" aria-hidden="true"><path d="M7 52V32c0-7.5 5.6-12 13-12s13 4.5 13 12v20z" fill="${c}"/><path d="M14.5 22v30M25.5 22v30" stroke="#F2B33D" stroke-width="3.2"/><circle cx="20" cy="13.5" r="6.2" fill="#E6C29A"/><path d="M11 12a9 7.5 0 0 1 18 0z" fill="#F2B33D"/><rect x="9" y="11" width="22" height="2.6" rx="1.3" fill="#D3921F"/></svg>`;

const prefBadge=pf=>!pf?'':pf.st==='ok'?`<span class="bdg pref">✓ OK pref.${pf.p&&pf.p.okEm&&!pf.p.email?' · falta e-mail':''}</span>`:pf.st==='wait'?`<span class="bdg pref wait">Aguardando pref.</span>`:`<span class="bdg pref need">Precisa OK pref.</span>`;

const pview=()=>{try{return localStorage.getItem('voltra-pview')||'esteira';}catch(e){return S.ui.pview||'esteira';}};
const estSel=pr=>(S.ui.estSel&&S.ui.estSel[pr.id])||(estAtual(pr)&&estAtual(pr)!=='fim'?estAtual(pr):'venda');
const estLane=pr=>(S.ui.estLane&&S.ui.estLane[pr.id])||null;

const pendEt=(pr,k)=>{const cur=estAtual(pr);if(!cur||cur==='fim'||etIdx(k)<0||etIdx(k)>=etIdx(cur))return false;const t=estT(pr);return itensDaEtapa(pr,k).some(i=>!t.ef(i.id));};
const stVis=(pr,k,st)=>st==='done'&&pendEt(pr,k)?'pend':st;
function estStatus(pr,k){const cur=estAtual(pr),i=etIdx(k),ci=etIdx(cur);if(!cur)return 'none';if(cur==='fim'||i<ci)return 'done';if(i===ci)return 'cur';return temAdiantado(pr,k)?'adi':'lock';}
const ST_TXT={done:'Concluída',pend:'Com pendência',cur:'Etapa atual',lock:'Travada',adi:'Adiantada',none:''};
const stChip=st=>st==='done'?'verde':st==='cur'||st==='pend'?'laranja':'vaga';
function estFoot(pr,k,st){const its=itensDaEtapa(pr,k),nd=its.filter(x=>x.feito).length;const pf=prefInfo(pr,k);
  const l=[];if(its.length)l.push(`<span class="mono">${nd}/${its.length}</span>`);
  if(st==='cur'){const v=podePassar(pr);l.push(`<span class="${v.ok?'ok-t':''}">${v.ok?'Pronta para passar':pf&&pf.st==='wait'&&!its.some(x=>!x.feito)?'Aguardando prefeitura':'Em andamento'}</span>`);}
  else if(st==='lock')l.push('<span>🔒 Travada</span>');else if(st==='adi')l.push('<span>Adiantada</span>');
  return l.join('');}
function estStHTML(pr,e){const k=e.k,st=estStatus(pr,k),r=respDe(pr,k),sel=estSel(pr)===k;const pf=prefInfo(pr,k);
  return `<button class="est-st s-${st}${sel?' sel':''}${k==='orgao'?' is-orgao':''}" style="grid-column:${etIdx(e.k)+1}" data-act="est-sel" data-p="${esc(pr.id)}" data-k="${k}" aria-label="${esc(`${etNum(k)} ${e.n}. ${ST_TXT[st]||''}`)}">
    <span class="est-txt"><span class="est-top"><span class="est-n">${etNum(k)}</span>${pf?prefBadge(pf):''}${e.ret?'<span class="bdg ret">↩ retorno</span>':''}</span>
      <strong class="est-nm">${etNomeHTML(k)}${st==='done'&&!pendEt(pr,k)?' <span class="ok-t">✓</span>':st==='done'?' <span class="hold-t">!</span>':''}</strong><small class="est-resp">${r?esc(curto(nomeDe(r))):'Responsável a definir'}</small>${(()=>{const q=nomesAtivos(missoesNos(pr,itensDaEtapa(pr,k).map(i=>i.id)));return q.length?`<small class="est-who${st==='lock'?' warn':''}">${st==='lock'?'⚠ ':''}Trabalhando: ${esc(q.join(', '))}</small>`:'';})()}</span>
    <span class="est-wk">${(()=>{const p=estAtual(pr)==='fim'?1:e2pDe(pr,itensDaEtapa(pr,k),st);return k==='orgao'?TEMPLO_MINI(p):e2mini(E2P[k],p);})()}</span>
    <span class="est-on">${st==='cur'?CAIXA:''}</span>
    <span class="est-ft">${estFoot(pr,k,st)}</span></button>`;}
function estCompHTML(pr,e){const k='complementares',st=estStatus(pr,k),sel=estSel(pr)===k,ln=lanesDe(pr),lane=estLane(pr);
  const hold=st==='cur'&&ln.some(l=>l.done)?ln.filter(l=>!l.done).map(l=>l.s):[];
  return `<div class="est-comp s-${st}${sel?' sel':''}" style="grid-column:${etIdx(e.k)+1}">
    <button class="est-txt est-comp-h" data-act="est-sel" data-p="${esc(pr.id)}" data-k="${k}"><span class="est-top"><span class="est-n">${etNum(k)}</span></span><strong class="est-nm">Complementares${st==='done'?' <span class="ok-t">✓</span>':''}</strong><small class="est-resp">${esc(e.d)}</small></button>
    <span class="est-wk est-wk3">${ln.slice(0,3).map(l=>e2mini(E2P[l.s]||E2P._,l.nt?l.nd/l.nt:0)).join('')}</span>
    <span class="est-on">${st==='cur'?CAIXA:''}</span>
    <div class="lanes">${ln.length?ln.map(l=>{const ld=l.s?pessoa(liderId(l.s)):null;
      return `<button class="lane${l.done?' l-done':''}${hold.includes(l.s)?' l-hold':''}${sel&&lane===l.s?' sel':''}" style="--lc:${E2L[l.s]||E2L['']}" data-act="est-lane" data-p="${esc(pr.id)}" data-s="${esc(l.s)}">
        <span class="lane-h">${e2mini(E2P[l.s]||E2P._,l.nt?l.nd/l.nt:0)}<span><strong>${esc(l.s?secNome(l.s):l.n)}</strong><small>${esc(l.n)}${ld&&ld.nome?' · '+esc(first(ld.nome)):''}</small></span><span class="lane-n mono">${l.nd}/${l.nt}</span></span>
        <span class="lane-belt">${l.its.map(x=>`<i class="lb${x.feito?' ok':x.retorno?' ret':''}" title="${esc((estT(pr).cod.get(x.id)||'')+' '+x.nome)}"></i>`).join('')}</span>
        ${(()=>{const q=quemFmt(missoesNos(pr,l.tops.flatMap(x=>[x.id,...subarvore(pr,x.id).map(y=>y.id)])),l.s);return q?`<small class="lane-who">Trabalhando: ${esc(q)}</small>`:'';})()}
        ${hold.includes(l.s)?'<small class="hold-t">Segurando a junção</small>':l.done?'<small class="ok-t">Pronta</small>':''}</button>`;}).join(''):'<p class="hint">Nenhuma disciplina complementar marcada.</p>'}</div></div>`;}

function evTxt(pr,v){const n=k=>etNome(k);const it=ids=>(ids||[]).map(id=>{const x=estT(pr).by.get(id);return x?x.nome:'';}).filter(Boolean).join(', ');
  switch(v.t){case 'criado':return 'Projeto entrou na esteira';case 'posicionou':return `Posicionado na etapa ${n(v.para)} (${v.origem==='existente'?'base existente':'do zero'})${v.obs?': '+v.obs:''}`;
  case 'passou':return v.para==='fim'?`Aprovado no órgão: projeto concluído`:`Passou de ${n(v.de)} para ${n(v.para)}`;
  case 'retorno':return `↩ Guindaste: voltou de ${n(v.de)} para ${n(v.para)}. Motivo: ${v.motivo}${v.itens&&v.itens.length?` · Itens: ${it(v.itens)}`:''}`;
  case 'pref_env':return `Enviado à prefeitura (${n(v.k)})`;case 'pref_ok':return `OK da prefeitura em ${n(v.k)}${v.data?' ('+fmtDate(v.data)+')':''}${v.email?' · formalizado por e-mail':' · falta formalizar por e-mail'}${v.obs?': '+v.obs:''}`;
  case 'pref_mail':return `OK da prefeitura em ${n(v.k)} formalizado por e-mail`;case 'adiantou':return `Adiantou ${v.nome||''}: ${v.just}`;
  case 'resp':return `Responsável de ${n(v.k)}: ${v.para?nomeDe(v.para):'a definir'}${v.de?' (antes '+nomeDe(v.de)+')':''}`;case 'origem':return `Origem alterada para ${v.origem==='existente'?'base existente':'do zero'}`;
  default:return v.t;}}
function estHistHTML(pr){const ev=(ES(pr).eventos||[]).slice().reverse();if(!ev.length)return '';const rets=ev.filter(v=>v.t==='retorno');
  const porSetor={};for(const r of rets)for(const id of r.itens||[]){const x=estT(pr).by.get(id);const s=x&&x.setor;if(s)porSetor[s]=(porSetor[s]||0)+1;}
  return `<details class="fold est-hist" ${fo('eh-'+pr.id,false)} data-fold="eh-${esc(pr.id)}"><summary>Histórico da esteira (${ev.length})${rets.length?` · ${rets.length} ${plural(rets.length,'retorno','retornos')}`:''}</summary><div class="in">
    ${rets.length?`<p class="hint">Retornos por equipe: ${Object.entries(porSetor).map(([s,n])=>`${esc(secNome(s))} ${n}`).join(' · ')||'—'}</p>`:''}
    <ol class="ehl">${ev.map(v=>`<li class="${v.t==='retorno'?'ret':''}"><span>${esc(evTxt(pr,v))}</span><small>${esc(nomeDe(v.por))} · ${fmtWhen(v.em)}</small></li>`).join('')}</ol></div></details>`;}

/* arquivos nas observações (item da esteira ou projeto) */
async function enviarArq(f){const ext=(f.name.includes('.')?f.name.split('.').pop().toLowerCase():'').slice(0,8)||'arq',pdf=ext==='pdf',raw=pdf||!!S.cap.fb;

function nomesAtivos(ms){const vis=new Set(),out=[];for(const m of ms){if(vis.has(m.pessoa))continue;vis.add(m.pessoa);out.push(curto(nomeDe(m.pessoa))+(runningOf(m)?' ▶':''));}return out;}
function quemFmt(ms,setor){const run=new Map();for(const m of ms)run.set(m.pessoa,run.get(m.pessoa)||!!runningOf(m));
  const by=new Map();for(const[pid,r]of run){const p=pessoa(pid),s=(p&&p.setor)||'';if(!by.has(s))by.set(s,[]);by.get(s).push(curto(nomeDe(pid))+(r?' ▶':''));}
  const parts=[];if(by.has(setor))parts.push(by.get(setor).join(', '));for(const[s,a]of by)if(s!==setor)parts.push(a.join(', ')+(s&&SEC[s]?' ('+secNome(s)+')':''));return parts.join(' · ');}

/* sugestão automática de item pela descrição da missão */
const normTxt=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const STOPW=new Set(['de','do','da','dos','das','com','para','por','em','no','na','nos','nas','projeto','projetos','pranchas','prancha','correcao','correcoes','apoio','fazer','completo','completa','revisar','revisao','montagem','montar','todos','todas','locais','envio']);
const toks=s=>normTxt(s).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOPW.has(w));
function sugerirItem(pr,titulo,setor,soLib){if(!pr||!isEst(pr))return null;const tt=toks(titulo);if(!tt.length)return null;const T2=new Set(tt);const t=estT(pr);let best=null,bs=0;
  const hit=w=>T2.has(w)||tt.some(z=>z.length>=5&&w.length>=5&&(z.startsWith(w.slice(0,5))||w.startsWith(z.slice(0,5))));
  for(const x of t.order){if(!checavel(x)||x.feito||(soLib&&!liberado(pr,x.id)))continue;const anc=[];let c=x;for(let g=0;g<6;g++){const p=c.pai&&t.by.get(c.pai);if(!p||p.etapa)break;anc.push(p.nome);c=p;}
    let sc=0;for(const w of toks(x.nome))if(hit(w))sc+=3;for(const w of toks(anc.join(' ')))if(hit(w))sc+=1;if(!sc)continue;
    if(setor&&x.setor===setor)sc+=1.5;if(!liberado(pr,x.id))sc-=1;if(sc>bs){bs=sc;best=x;}}
  return bs>=3?best:null;}
/* sugestão automática da etapa ao colocar na esteira */
function sugerirEtapa(pr){const p=isEst(pr)?pr:previewOf(pr),t=estT(p);const ms=Object.values(S.missoes).filter(m=>m.projeto===pr.id&&m.disciplina&&ATIVAS(m)&&t.by.has(m.disciplina));

  if(last>=0&&last+1<ETAPAS.length){const k=ETAPAS[last+1].k;return{k,motivo:`os itens até ${etNome(ETAPAS[last].k)} já estão concluídos`,ms:[]};}
  return{k:'venda',motivo:'nenhum item concluído nem missão em andamento',ms:[]};}

async function estDevolver(pid,dest,itens,motivo,pedirPref){await estUpd(pid,(pr,es,ds)=>{const cur=es.estacao;if(!cur||cur==='fim'||etIdx(dest)>=etIdx(cur)||etIdx(dest)<0)return false;const now=Date.now();

function converterItens(old){const MAP={d1:'e-briefing','d1-1':'e-briefing','d1-2':'e-briefing',d2:'e-arquitetonico',dimg:'e-concepcao',d3:'g-hid','d3-1':'g-hid',d4:'e-complementares',d5:'e-complementares',d6:'e-complementares',d7:'e-orcamento',d8:'e-memorial',d9:'e-complementares',d10:'e-complementares'};

  for(const x of estTpl())if(!seen.has(x.id)){rows.push({...x,inProj:false,tpl:true});seen.add(x.id);}
  for(const x of extras||[])if(!seen.has(x.id)){rows.push({...x,inProj:false,extra:true});seen.add(x.id);}
  const t=estT({disciplinas:rows});return t.order.map(x=>({...x,_d:t.depth.get(x.id)||0,_c:t.cod.get(x.id)}));}

async function salvarProjEst(f){const nome=val('pj-nome');if(!nome){ferr(f,'Dê um nome ao projeto.');return;}
  const setores=SECTORS.map(x=>x.id).filter(x=>val('pj-s-'+x));if(!setores.length){ferr(f,'Marque ao menos uma equipe, ou Todas.');return;}
  const id=f.dataset.id,pr=id?S.projetos[id]:null,rows=estRows(pr,(S.modal&&S.modal.extras)||[]);
  const isRetro=!!(document.getElementById('pj-retro')&&val('pj-retro'));let rinfo=null;
  if(isRetro){const rd=val('pj-rd'),rj=val('pj-rj');if(!rd||rd>isoDate(Date.now())){ferr(f,'Informe a data de conclusão, hoje ou antes.');return;}if(rj.length<8){ferr(f,'Explique por que o projeto está sendo lançado só agora.');return;}rinfo={por:myPid()||'admin',em:Date.now(),dataInformada:rd,justificativa:rj};}
  const by=new Map(rows.map(r=>[r.id,r]));const keep=new Set();
  for(const r of rows){if(r.etapa){keep.add(r.id);continue;}if(!val('pj-d-'+r.id))continue;let c=r;for(let g=0;g<20&&c;g++){keep.add(c.id);c=c.pai?by.get(c.pai):null;}}
  const now=Date.now(),me0=myPid()||'admin';let novasRetro=0;
  const ds=rows.filter(r=>keep.has(r.id)).map(r=>{const o={id:r.id,nome:r.nome,pai:r.pai||null,setor:r.etapa?null:(document.getElementById('pj-ds-'+r.id)?val('pj-ds-'+r.id)||null:(r.setor||null)),grupo:!!r.grupo,feito:!!r.feito,feitoEm:r.feitoEm||null,feitoPor:r.feitoPor||null};
    if(r.etapa)o.etapa=r.etapa;for(const k of['feitoVia','retorno','nret','posicionado','retro','cu','nota'])if(r[k]!=null)o[k]=r[k];
    if(rinfo&&checavel(o)&&!o.feito){o.feito=true;o.feitoEm=dateMs(rinfo.dataInformada)+12*H;o.feitoPor=rinfo.por;o.retro=true;novasRetro++;}return o;});
  renumerar(ds);const origem=val('pj-or')||'zero',resp={};for(const e of ETAPAS)resp[e.k]=val('pj-r-'+e.k)||null;
  const data={nome,cidade:val('pj-cid'),tipo:val('pj-tipo'),setores,setor:setores[0],prazo:val('pj-prazo'),disciplinas:ds,impedimento:val('pj-imp'),impedimentoQuem:val('pj-quem'),observacao:val('pj-obs'),vendedor:val('pj-vend'),atualizadoEm:now};

    for(const e of ETAPAS){const a=(es.resp||{})[e.k]||null;if(a!==resp[e.k])evPush(es,{t:'resp',k:e.k,de:a,para:resp[e.k]});}es.resp=resp;}
  else{es=novaEsteira(origem,resp);const ini=val('pj-ini')||'venda';const i=etIdx(ini);es.estacao=ini;
    for(const e of ETAPAS){es.est[e.k]=e.i<i?{passouEm:now,passouPor:me0,posicionado:true}:e.i===i?{entrouEm:now}:{};}
    if(i>0){const t=estT({disciplinas:ds});for(const x of ds)if(checavel(x)&&etIdx(t.etp.get(x.id))<i&&!x.feito){x.feito=true;x.feitoEm=now;x.feitoPor=me0;x.posicionado=true;}evPush(es,{t:'posicionou',para:ini,origem});}}

    if(rinfo){await Col('conclusoes').add({tipo:'projeto',ref:ref.id,titulo:nome,projeto:ref.id,projetoNome:nome,pessoa:null,setor:setores[0]||null,por:rinfo.por,em:rinfo.em,dataInformada:rinfo.dataInformada,horasInformadas:null,justificativa:rinfo.justificativa,itens:novasRetro});
      const de=first(nomeDe(myPid()));for(const g of gestaoIds())await avisar(g,`${de} lançou o projeto “${nome}” como já concluído. Justificativa: ${rinfo.justificativa.length>70?rinfo.justificativa.slice(0,70)+'…':rinfo.justificativa}`,null,'retro');}

  if(ok){S.modal=null;Object.keys(S.drafts).filter(x=>x.startsWith('pj-')).forEach(x=>delete S.drafts[x]);render();}}

document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.etpl&&S.ui.etpl){const it=S.ui.etpl.find(x=>x.id===t.dataset.etpl);if(it)it[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.f!=='nome')S.lastHtml=null;return;}if(t.dataset&&t.dataset.tpl&&S.ui.tpl){const it=S.ui.tpl.find(x=>x.id===t.dataset.tpl);if(it)it[t.dataset.f]=t.value;}if(!t.id||t.type==='file')return;S.drafts[t.id]=t.type==='checkbox'?t.checked:t.value;if(t.id==='as-tit'){clearTimeout(S._sugT);S._sugT=setTimeout(scheduleRender,450);}if(t.id==='pj-busca'){clearTimeout(S._bT);S._bT=setTimeout(scheduleRender,220);}const f=t.form;if(f){const er=f.querySelector('.ferr');if(er)er.remove();}if(t.id==='quem-q')scheduleRender();});

  if(t.type==='file')return;
  if(t.id)S.drafts[t.id]=t.type==='checkbox'?t.checked:t.value;
  if(t.id==='as-proj'){delete S.drafts['as-disc'];render();return;}
  if(t.id==='pj-fet'||t.id==='pf-cid'||t.id==='pf-sit'||t.id==='pa-mot'){render();return;}
  if(t.id==='pe-papel'){render();return;}
  if(t.id==='as-retro'||t.id==='as-val'||t.id==='pj-retro'||(t.id&&(t.id.startsWith('hc-')||t.id.startsWith('at-')))){render();return;}
  if(t.id==='pj-s-all'){SECTORS.forEach(x=>{S.drafts['pj-s-'+x.id]=t.checked;});render();return;}
  if(t.id&&t.id.startsWith('pj-s-')){render();return;}
  if(t.dataset&&t.dataset.estresp){const[pid,k]=t.id.slice(3).split('--');estResp(pid,k,t.value);return;}
  if(t.id==='er-dest'){Object.keys(S.drafts).filter(x=>x.startsWith('er-i-')).forEach(x=>delete S.drafts[x]);delete S.drafts['er-pref'];render();return;}
  if(t.id&&t.id.startsWith('pj-d-')&&S.modal&&S.modal.type==='projeto'&&document.querySelector('form[data-form="projeto"][data-est]')){const did=t.id.slice(5);const rows=estRows(S.modal.id?S.projetos[S.modal.id]:null,S.modal.extras||[]);
    const kids=id=>rows.filter(r=>r.pai===id);const go=id=>{for(const r of kids(id)){S.drafts['pj-d-'+r.id]=t.checked;go(r.id);}};go(did);render();return;}
  if(t.id&&t.id.startsWith('pj-d-')&&S.modal&&S.modal.type==='projeto'){const did=t.id.slice(5);pjRows(S.modal.id?S.projetos[S.modal.id]:null,S.modal.extras||[]).filter(r=>r.pai===did).forEach(r=>{S.drafts['pj-d-'+r.id]=t.checked;});render();return;}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.fold)S.ui.fold[d.dataset.fold]=d.open;},true);
function ferr(f,t){let el=f.querySelector('.ferr');if(!el){el=document.createElement('p');el.className='ferr';el.setAttribute('role','alert');f.appendChild(el);}el.textContent=t;}
const val=id=>{const el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:String(el.value).trim()):'';};
const okTime=s=>/^\d\d:\d\d$/.test(s);
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const k=f.dataset.form;
  if(k==='comentar'){const mid=f.dataset.m,t=val('c-'+mid);if(!t)return;await comentar(mid,t);return;}
  if(k==='atribuir'){const pid=f.dataset.p,proj=val('as-proj'),tit=val('as-tit'),h=parseFloat(val('as-h'));
    if(proj==='__novo'&&!val('as-nn')){ferr(f,'Dê um nome ao novo projeto.');return;}
    const isRetro=!!(document.getElementById('as-retro')&&val('as-retro'));let retro=null;
    if(!tit){ferr(f,'Escreva o nome da missão.');return;}
    if(isRetro){const rd=val('as-rd'),rj=val('as-rj'),rh=parseFloat(String(val('as-rh')).replace(',','.'));
      if(!rd||rd>isoDate(Date.now())){ferr(f,'Informe a data de conclusão, hoje ou antes.');return;}
      if(rj.length<8){ferr(f,'Explique por que a missão está sendo lançada só agora.');return;}
      retro={rd,rj,rh:isNaN(rh)?null:rh};}
    else if(isTerc(pid)){const pd=val('as-pd');if(!pd){ferr(f,'Informe a data de entrega prevista.');return;}}
    else if(!(h>0)){ferr(f,'Informe o prazo em horas úteis.');return;}
    await atribuir(pid,{projeto:proj,novoNome:val('as-nn'),novoCidade:val('as-nc'),titulo:tit,descricao:val('as-desc'),horas:h,foco:document.getElementById('as-foco')?val('as-foco'):true,validador:document.getElementById('as-val')?val('as-val'):null,disciplina:document.getElementById('as-disc')?val('as-disc'):null,retro,prazoData:document.getElementById('as-pd')?val('as-pd'):null});return;}

    if(pdEl&&!val('em-pd')){ferr(f,'Informe a data de entrega prevista.');return;}if(!pdEl&&!(h>0)){ferr(f,'Informe o prazo em horas úteis.');return;}
    await salvarMissao(f.dataset.m,{titulo:tit,descricao:val('em-desc'),motivo:val('em-mot'),horas:h,prazoData:pdEl?val('em-pd'):null});return;}
  if(k==='devolver'){const eid=f.dataset.e,t=val('fix-'+eid);if(!t){ferr(f,'Descreva o que precisa ser corrigido.');return;}await devolver(eid,t);return;}
  if(k==='ausencia'){const de=val('au-de'),ate=val('au-ate')||de;if(!de||ate<de){ferr(f,'Confira as datas: o fim não pode ser antes do início.');return;}

    if(ok)['au-de','au-ate','au-mot'].forEach(x=>delete S.drafts[x]);return;}
  if(k==='jornada'){const j=['jo-1','jo-2','jo-3','jo-4'].map(val);if(!j.every(okTime)||!(j[0]<j[1]&&j[1]<=j[2]&&j[2]<j[3])){ferr(f,'Confira os horários: entrada, almoço e saída em ordem.');return;}
    const ok=await act(async()=>{await D('pessoas/'+f.dataset.p).update({jornada:j});toast('Jornada salva.');});if(ok)['jo-1','jo-2','jo-3','jo-4'].forEach(x=>delete S.drafts[x]);return;}
  if(k==='link'){const url=val('lk-url');if(!/^https:\/\/\S+\.\S+/.test(url)){ferr(f,'Cole um link que comece com https://');return;}await addLink(f.dataset.m,url,val('lk-nome'));S.ui.link=null;delete S.drafts['lk-url'];delete S.drafts['lk-nome'];return;}
